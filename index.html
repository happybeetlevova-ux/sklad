function migrate(sk,ce){

    D.log=Array.isArray(sk.log)?sk.log:[];
  }
  const items=ce&&Array.isArray(ce.items)?ce.items:CATALOG;
  for(const it of items){
    let pr=D.products.find(x=>normName(x.name)===normName(it.name));
    if(!pr){pr=newProduct({name:it.name});D.products.push(pr)}
    pr.sku=pr.sku||it.sku||"";pr.h=it.h||0;pr.plan=it.plan||0;

  }
  D.notice={sk:useSk,ce:!!ce};
  return D;
}

function cost(x){
  const P=S.p,h=x.h||0,lines=[];let plastic=0,grams=0,parts=0,extra=0;
  for(const r of x.rec.pl){const m=find("plastics",r.id);if(!m||!(r.q>0))continue;const pk=m.pk>0?m.pk:P.ppk,v=r.q*pk/1000;plastic+=v;grams+=r.q;lines.push({t:m.name,h:`${n1(r.q,2)} г × ${n1(pk,0)} ₽/кг`,v})}

  return {total:plastic+parts+extra+elec+labor+wear+defect+delivery,plastic,grams,lines};

/* фактический брак по журналу за 90 дней */
let _defMemo=null;
function defStats(){
  const key=S.log.length+"|"+(S.log[0]&&S.log[0].id)+"|"+S.log.filter(e=>e.undone).length;
  if(_defMemo&&_defMemo.key===key)return _defMemo;

    const good=e.good!=null?e.good:(c0&&c0.c==="products"?c0.d:0),def=e.def||0;
    all.good+=good;all.def+=def;if(pid){const o=by[pid]||(by[pid]={good:0,def:0});o.good+=good;o.def+=def}}
  _defMemo={key,by,all};return _defMemo;
}
function defRate(x){
  const P=S.p;if(P.defMode==="param")return {k:P.defect,src:"param"};
  const st=defStats(),o=x&&x.id?st.by[x.id]:null;
  if(o&&o.good+o.def>=20&&o.good>0)return {k:o.def/o.good,src:"own",good:o.good,def:o.def};

}
function wbCalc(c,h,b){
  const P=S.p,lb=b.lb>0?b.lb:P.lb,k=b.buy>0?b.buy:P.buy,acc=b.acc||0;
  const G=b.pb*(1-b.disc),L=lb/k,U=G*P.acq,comm=b.comm*G,ads=b.ads*G;
  const O=G-comm-L-acc-ads-U,tax=G*P.tax,Q=O-c-tax;
  return {G,L,U,comm,ads,acc,O,tax,Q,margin:G?Q/G:NaN,roi:c?Q/c:NaN,perH:h?Q/h:NaN,month:h?Q*24/h*P.load*30:NaN,buyerPrice:G*(1-(b.spp||0))};
}

function undo(id){
  const e=S.log.find(x=>x.id===id);if(!e||e.undone)return;
  const back=[];for(const ch of e.changes){const it=find(ch.c,ch.id);if(it){it.qty=r1(it.qty-ch.d);back.push({...ch,d:-ch.d})}}
  e.undone=true;S.log.unshift({id:uid(),t:Date.now(),text:"Отмена: "+e.text,changes:back,isUndo:true});
  let extra="";
  if(e.dealId){S.deals=S.deals.filter(d=>d.id!==e.dealId);S.money=S.money.filter(m=>m.ref!==e.dealId);extra=", оптовая сделка удалена";
    if(e.newBuyer&&!S.deals.some(d=>d.bid===e.newBuyer)){const bb=S.buyers.find(x=>x.id===e.newBuyer);if(bb&&!bb.phone&&!bb.note)S.buyers=S.buyers.filter(x=>x.id!==e.newBuyer)}}
  if(e.moneyId){S.money=S.money.filter(m=>m.id!==e.moneyId);extra=", расход в кассе удалён"}
  if(e.prevPrice!=null&&e.changes[0]){const m=find(e.changes[0].c,e.changes[0].id);if(m){if(e.changes[0].c==="plastics")m.pk=e.prevPrice;else m.price=e.prevPrice;extra+=", цена вернулась к прежней"}}
  save();render();toast("Операция отменена, остатки вернулись"+extra);
}

/* ================= изделия: список ================= */
function productsHtml(){
  const q=($("#q")&&$("#q").value||"").trim().toLowerCase();
  const R=ranks();
  let all=S.products.map(x=>({x,r:calc(x)}));
  const on=all.filter(o=>o.r.w),avg=f=>on.length?on.reduce((a,o)=>a+f(o),0)/on.length:NaN;
  const kp=`<div class="kpis"><div class="kpi"><span>Деньги на складе</span><b>${rub(stockValue())}</b><small>по себестоимости</small></div><div class="kpi"><span>Среднее ₽/час</span><b>${n1(avg(o=>o.r.w.perH),0)}</b><small>маржа ${pct(avg(o=>o.r.w.margin))}</small></div><div class="kpi"><span>Пополнить</span><b>${lowCount("products")}</b><small>изделий ниже минимума</small></div></div>`;
  if(q)all=all.filter(o=>(o.x.name+" "+o.x.sku).toLowerCase().includes(q));
  if(onlyLow)all=all.filter(o=>needs(o.x));
  const rank={bad:0,warn:1,ok:2,none:3};
  const keys={attention:(a,b)=>(rank[state(a.x)]-rank[state(b.x)]),hour:(a,b)=>(b.r.w?b.r.w.perH:-1e9)-(a.r.w?a.r.w.perH:-1e9),margin:(a,b)=>(b.r.w?b.r.w.margin:-1e9)-(a.r.w?a.r.w.margin:-1e9),name:()=>0};
  all.sort((a,b)=>keys[prodSort](a,b)||a.x.name.localeCompare(b.x.name,"ru"));
  const chip=(k,t)=>`<button type="button" class="chip ${prodSort===k&&!(k==="attention"&&onlyLow)?"on":""}" data-sort="${k}">${t}</button>`;
  const head=`<div class="bar"><div class="chips">${chip("attention","Остаток")}${chip("hour","₽/час")}${chip("margin","Маржа")}${chip("name","А–Я")}<button type="button" class="chip ${onlyLow?"on":""}" data-act="onlyLow">Пополнить</button></div></div>`;
  const wbb=wbBarHtml()+(S.ui.widgets&&S.ui.widgets.includes("today")?"":todayBarHtml());
  const wg=q?"":widgetsHtml();
  if(!S.products.length)return wg+kp+wbb+`<div class="empty"><b>Изделий пока нет</b>Нажмите «+», чтобы добавить первое.</div>`;
  if(!all.length)return wg+kp+wbb+head+`<div class="empty"><b>Ничего не найдено</b>${onlyLow?"Всё в норме.":"Попробуйте другое слово."}</div>`;
  return wg+kp+wbb+head+`<div class="list">${all.map(({x,r})=>{
    const st=state(x),w=r.w,pl=R.m[x.id],[tc]=hourTag(w?w.perH:NaN);
    const eco=w?`${n1(w.perH,0)} ₽/ч${pl?" · #"+pl:""} · маржа ${pct(w.margin)}`:x.h>0?"нет цены WB":"не указано время печати";
    return `<button type="button" class="row" data-prod="${x.id}"><span class="lead"><span class="stripe ${st}"></span></span><span class="info"><b>${esc(x.name)}</b><small>себест. ${rub(r.c.total)} · <span style="color:var(--${tc==="ok"?"ok":tc==="warn"?"warn":tc==="bad"?"bad":tc==="mid"?"accent":"muted"})">${eco}</span></small></span><span class="qty"><b>${n1(x.qty)}<small>шт</small></b><span class="tag ${st}">${STATE_TXT[st]}</span></span></button>`}).join("")}</div>
  <p class="hint">Цветная полоска — остаток на складе. ₽/ч — прибыль за час работы принтера и место среди изделий: ниже 70 ₽/ч стоит поднять цену или ускорить печать.</p>`;
}

function wbBarHtml(){

/* ================= материалы ================= */
function materialsHtml(){
  const c=matTab,q=($("#q")&&$("#q").value||"").trim().toLowerCase();
  let items=S[c].filter(x=>!q||(x.name+" "+(x.brand||"")).toLowerCase().includes(q));
  const low=S[c].filter(needs).length;
  if(onlyLow)items=items.filter(needs);
  items.sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  let val=0,sum="";
  if(c==="plastics"){for(const m of S.plastics)val+=Math.max(0,m.qty)*(m.pk>0?m.pk:S.p.ppk)/1000;sum=`${n1(S.plastics.reduce((a,x)=>a+Math.max(0,x.qty),0)/1000)} кг на ${rub(val)}`}
  else{for(const m of S.parts)val+=Math.max(0,m.qty)*(m.price||0);sum=`${S.parts.length} поз. на ${rub(val)}`}
  const noPrice=c==="parts"?S.parts.filter(x=>!(x.price>0)).length:0;
  const head=`<div class="seg"><button type="button" data-mat="plastics" class="${c==="plastics"?"on":""}">Пластик</button><button type="button" data-mat="parts" class="${c==="parts"?"on":""}">Детали и упаковка</button></div>
   <div class="bar"><span class="summary">${sum}</span><div class="chips"><button type="button" class="chip ${!onlyLow?"on":""}" data-act="allMat">Все</button><button type="button" class="chip ${onlyLow?"on":""}" data-act="onlyLow">Пополнить${low?" · "+low:""}</button></div></div>
   ${noPrice?`<div class="banner"><p>У ${noPrice} поз. не указана цена — в себестоимости они считаются по 0 ₽. Откройте деталь → «Изменить» и введите цену за штуку, или укажите сумму при следующем приходе.</p></div>`:""}`;
  if(!S[c].length)return head+`<div class="empty"><b>Пока пусто</b>Нажмите «+», чтобы добавить ${c==="plastics"?"первую катушку":"первую деталь или упаковку"}.</div>`;
  if(!items.length)return head+`<div class="empty"><b>Ничего не найдено</b></div>`;
  return head+`<div class="list">${items.map(it=>{
    const st=state(it),u=unitOf(c,it);let sub,lead=`<span class="stripe ${st}"></span>`;
    if(c==="plastics"){sub=`${n1(it.pk>0?it.pk:S.p.ppk,0)} ₽/кг · ≈ ${n1(Math.max(0,it.qty)/(it.spool||1000))} кат. · мин. ${n1(it.min)} г`;lead+=`<span class="sw" style="border-color:${esc(it.hex||"#888")}"></span>`}
    else sub=`${it.price>0?rub(it.price,2)+" за "+esc(u):"цена не указана"} · мин. ${n1(it.min)}`;
    return `<button type="button" class="row" data-c="${c}" data-id="${it.id}"><span class="lead">${lead}</span><span class="info"><b>${esc(it.name)}</b><small>${sub}</small></span><span class="qty"><b>${n1(it.qty)}<small>${esc(u)}</small></b><span class="tag ${st}">${STATE_TXT[st]}</span></span></button>`}).join("")}</div>`;
}

    </div>`:"";
  const paidField=op==="in"&&c!=="products"?`<div class="field"><span>Заплатил за эту поставку, ₽ (необязательно)</span><input id="a_paid" class="inp" type="text" inputmode="decimal" placeholder="Например: 1450"><small>Средняя цена ${c==="plastics"?"за кг":"за "+esc(u)} пересчитается, и себестоимость изделий обновится</small></div>`:"";
  openSheet(`<h2>${T[0]}: ${esc(it.name)}</h2><p class="sub">${T[1]}</p>

    <div class="row2"><button type="button" class="btn main" id="a_ok">${T[2]}</button><button type="button" class="btn" id="a_cancel">Назад</button></div>`,
  s=>{
    const inp=s.querySelector("#a_n"),prev=s.querySelector("#a_prev"),paid=s.querySelector("#a_paid");
    let chan="wb",rchan="wb";
    const defEl=s.querySelector("#a_def");
    const retVals=()=>{if(!isRet||rchan!=="opt")return null;return {buyer:s.querySelector("#r_buyer").value.trim(),price:num(s.querySelector("#r_price").value),refund:s.querySelector("#r_refund").checked}};
    if(isRet){
      s.querySelectorAll("[data-rch]").forEach(b=>b.onclick=()=>{rchan=b.dataset.rch;s.querySelectorAll("[data-rch]").forEach(x=>x.classList.toggle("on",x===b));s.querySelector("#r_opt").hidden=rchan!=="opt";upd()});
      s.querySelector("#r_buyer").addEventListener("change",()=>{const bo=buyerByName(s.querySelector("#r_buyer").value);const last=bo?S.deals.filter(d=>d.bid===bo.id&&d.pid===id&&d.q>0).sort((x,y)=>y.t-x.t)[0]:null;if(last)s.querySelector("#r_price").value=dec(last.price);upd()});

    if(defEl)defEl.addEventListener("input",()=>upd());
    const optVals=()=>{if(chan!=="opt")return null;return {buyer:s.querySelector("#a_buyer").value.trim(),price:num(s.querySelector("#a_price").value),tax:+s.querySelector("#a_tax").value,paidNow:s.querySelector("#a_paidnow").checked}};
    const suggest=()=>{

      const bo=buyerByName(b);
      if(bo){s.querySelector("#a_tax").value=String(bo.tax);const bp=buyerPrice(bo,it);if(bp){if(!pi.dataset.touched)pi.value=dec(bp.price);h.textContent=bp.src;return}}
      else if(b)h.textContent="новый покупатель — появится в справочнике";
      const prevDeal=S.deals.filter(d=>d.pid===id&&(!b||d.buyer===b)).sort((x,y)=>y.t-x.t)[0]||S.deals.filter(d=>d.pid===id).sort((x,y)=>y.t-x.t)[0];
      if(prevDeal){if(!pi.dataset.touched)pi.value=dec(prevDeal.price);h.textContent=(b&&!bo?"новый покупатель · ":"")+"последняя цена "+rub(prevDeal.price)+(prevDeal.buyer?" ("+prevDeal.buyer+")":"");return}
      const r=calc(it);if(r.w){const o=wholesale(r.c.total,r.w.G,it.wb.comm,r.w.L,0.07);if(!pi.dataset.touched)pi.value=String(o.opt);h.textContent="расчётная оптовая цена; себестоимость "+rub(r.c.total)}else h.textContent="себестоимость "+rub(r.c.total);
    };
    if(isShip){
      s.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{chan=b.dataset.ch;s.querySelectorAll("[data-ch]").forEach(x=>x.classList.toggle("on",x===b));s.querySelector("#a_opt").hidden=chan!=="opt";const wh=s.querySelector("#a_wbh");if(wh)wh.hidden=chan!=="wb";if(chan==="opt")suggest();upd()});
      s.querySelector("#a_buyer").addEventListener("change",()=>{const pi=s.querySelector("#a_price");delete pi.dataset.touched;suggest();upd()});
      s.querySelector("#a_price").addEventListener("input",e=>{e.target.dataset.touched="1";upd()});
      s.querySelector("#a_tax").addEventListener("change",()=>upd());
    }
    const build=()=>{
      if(op==="print"){const g=num(inp.value)>0?num(inp.value):0,df=defEl&&num(defEl.value)>0?num(defEl.value):0;if(!(g+df>0))return null;const all=g+df;
        const ch=[{c,id,d:g}];it.rec.pl.forEach(r=>ch.push({c:"plastics",id:r.id,d:-r1(r.q*all)}));it.rec.pt.forEach(r=>ch.push({c:"parts",id:r.id,d:-r1(r.q*all)}));return ch}
      const n=num(inp.value);if(!(n>=0)||(op!=="set"&&!(n>0)))return null;
      if(op==="set")return [{c,id,d:r1(n-it.qty)}];
      return [{c,id,d:(op==="ship"||op==="out")?-n:n}];  /* in, ret: плюс */
    };
    const newPrice=()=>{
      if(!paid)return null;const n=num(inp.value),pd=num(paid.value);if(!(n>0)||!(pd>0))return null;
      const per=c==="plastics"?pd/n*1000:pd/n,old=c==="plastics"?(it.pk>0?it.pk:S.p.ppk):(it.price||0),oq=Math.max(0,it.qty);
      const avg=old>0&&oq>0?(oq*old+n*per)/(oq+n):per;return {per,avg};
    };
    const upd=()=>{
      const ch=build();if(!ch){prev.innerHTML="";return}
      const rows=ch.filter(x=>find(x.c,x.id)).map(x=>{const m=find(x.c,x.id),left=r1(m.qty+x.d);return `<div class="ln"><span>${esc(m.name)}</span><span>${x.d>0?"+":"−"}${n1(Math.abs(x.d))} → <span class="${left<0?"neg":""}">${n1(left)} ${esc(unitOf(x.c,m))}</span></span></div>`});
      const short=ch.some(x=>{const m=find(x.c,x.id);return m&&m.qty+x.d<0});
      const np=newPrice();const pu=c==="plastics"?"₽/кг":"₽ за "+u;
      const ov=optVals(),n0=num(inp.value);let optH="";
      const dfv=defEl&&num(defEl.value)>0?num(defEl.value):0;
      if(dfv>0){let mat=0;it.rec.pl.forEach(r=>{const m=find("plastics",r.id);if(m)mat+=r.q*(m.pk>0?m.pk:S.p.ppk)/1000});it.rec.pt.forEach(r=>{const m=find("parts",r.id);if(m)mat+=r.q*(m.price||0)});if(it.g0>0)mat+=it.g0*(it.p0k||S.p.ppk)/1000;optH+=`<div class="ln"><span>В брак: ${n1(dfv)} шт</span><span class="minus">материалы ≈ ${rub(mat*dfv)}</span></div>`}
      const rv=retVals();if(rv&&rv.price>0&&n0>0)optH+=`<div class="ln"><span>Возврат покупателю ${esc(rv.buyer)}</span><span class="minus">−${rub(rv.price*n0)}</span></div>`;
      if(ov&&ov.price>0&&n0>0){const sum=ov.price*n0,cst=cost(it).total*n0,tx=sum*ov.tax;optH=`<div class="ln"><span><b>Сумма сделки</b></span><span><b>${rub(sum,2)}</b></span></div><div class="ln"><span>Себестоимость · налог ${pct(ov.tax,0)}</span><span>−${rub(cst)} · −${rub(tx)}</span></div><div class="ln"><span>Прибыль</span><span class="${sum-cst-tx<0?"neg":"plus"}">${rub(sum-cst-tx)}</span></div>`}
      prev.innerHTML=`<div class="box"><h3>Что изменится</h3>${rows.join("")}${optH}${np?`<div class="ln"><span>Цена этой поставки</span><span>${n1(np.per,2)} ${esc(pu)}</span></div><div class="ln"><span><b>Новая средняя цена</b></span><span><b>${n1(np.avg,2)} ${esc(pu)}</b></span></div>`:""}${short?`<p class="hint neg">Не хватает остатков. Сохранить можно, но лучше сначала проверить склад.</p>`:""}${op==="print"&&!(it.rec.pl.length||it.rec.pt.length)?`<p class="hint">Состав не указан, поэтому материалы не спишутся.</p>`:""}</div>`;
    };
    inp.addEventListener("input",upd);paid&&paid.addEventListener("input",upd);
    s.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{inp.value=String(r1((num(inp.value)||0)+(+b.dataset.add))).replace(".",",");upd()});
    s.querySelector("#a_cancel").onclick=()=>c==="products"?closeSheet():openMat(c,id);
    s.querySelector("#a_ok").onclick=()=>{
      const ch=build();if(!ch){inp.focus();toast("Введите количество больше нуля");return}
      const n=num(inp.value)>0?num(inp.value):0,np=newPrice(),ov=optVals(),rv=retVals(),dfv=defEl&&num(defEl.value)>0?num(defEl.value):0;
      if(rv){if(!rv.buyer){toast("Укажите покупателя");return}if(!(rv.price>=0)){toast("Укажите цену возврата");return}}
      if(ov){if(!ov.buyer){toast("Укажите покупателя");s.querySelector("#a_buyer").focus();return}if(!(ov.price>0)){toast("Укажите цену за штуку");s.querySelector("#a_price").focus();return}}
      const prevPrice=np?(c==="plastics"?(it.pk>0?it.pk:S.p.ppk):(it.price||0)):null;
      if(np){if(c==="plastics")it.pk=Math.round(np.avg*100)/100;else it.price=Math.round(np.avg*100)/100}
      const text=ov?`Опт: ${it.name} × ${n1(n)} → ${ov.buyer}`:rv?`Возврат от ${rv.buyer}: ${it.name} × ${n1(n)}`:op==="print"&&!n?`Брак: ${it.name} × ${n1(dfv)}`:{print:`Напечатано: ${it.name} × ${n1(n)}${dfv?` (брак ${n1(dfv)})`:""}`,ret:`Вернулось на склад: ${it.name} × ${n1(n)}`,ship:`Отгружено: ${it.name} × ${n1(n)}`,in:`Приход: ${it.name}`,out:`Расход: ${it.name}`,set:`Пересчёт: ${it.name}`}[op];
      const note=[s.querySelector("#a_note").value.trim(),np?`оплачено ${rub(num(paid.value))}`:"",ov?`${rub(ov.price)}/шт, налог ${pct(ov.tax,0)}${ov.paidNow?"":", ждём оплату"}`:""].filter(Boolean).join(" · ");
      const ok=commit(text,ch,note);if(!ok&&np)save();
      if(ok&&op==="print"){ok.hours=Math.round((n+dfv)*(it.h||0)*100)/100;ok.pid=id;ok.good=n;if(dfv)ok.def=dfv;save()}
      if(ok&&rv){let bo=buyerByName(rv.buyer);if(!bo){bo={id:uid(),name:rv.buyer,tax:0.06,phone:"",note:"",disc:0,prices:{}};S.buyers.push(bo)}
        const lastTax=(S.deals.filter(d=>d.bid===bo.id&&d.pid===id&&d.q>0).sort((x,y)=>y.t-x.t)[0]||{}).tax;
        const d={id:uid(),t:ok.t,buyer:bo.name,bid:bo.id,pid:id,name:it.name,q:-n,price:rv.price,sum:-Math.round(rv.price*n*100)/100,cost:-Math.round(cost(it).total*n*100)/100,tax:lastTax!=null?lastTax:bo.tax,paidAt:ok.t,ret:true};S.deals.push(d);ok.dealId=d.id;
        if(rv.refund&&rv.price>0)S.money.push({id:uid(),t:ok.t,type:"out",cat:"Возврат покупателю",amount:Math.round(rv.price*n*100)/100,note:`${bo.name}: ${it.name} × ${n1(n)}`,ref:d.id});save()}
      if(ok&&ov){let bo=buyerByName(ov.buyer);let newB=false;if(!bo){bo={id:uid(),name:ov.buyer,tax:ov.tax,phone:"",note:"",disc:0,prices:{}};S.buyers.push(bo);newB=true}
        if(s.querySelector("#a_remember").checked)bo.prices[id]=ov.price;
        const d={id:uid(),t:ok.t,buyer:bo.name,bid:bo.id,pid:id,name:it.name,q:n,price:ov.price,sum:Math.round(ov.price*n*100)/100,cost:Math.round(cost(it).total*n*100)/100,tax:ov.tax,paidAt:ov.paidNow?ok.t:null};S.deals.push(d);ok.dealId=d.id;if(newB)ok.newBuyer=bo.id;
        if(ov.paidNow)S.money.push({id:uid(),t:ok.t,type:"in",cat:"Опт",amount:d.sum,note:`${ov.buyer}: ${it.name} × ${n1(n)}`,ref:d.id});save()}
      if(ok&&np){const m={id:uid(),t:ok.t,type:"out",cat:c==="plastics"?"Пластик":"Детали и упаковка",amount:num(paid.value),note:`${it.name}, ${n1(n)} ${u}`,ref:ok.id};S.money.push(m);ok.moneyId=m.id;ok.prevPrice=prevPrice;save()}
      closeSheet();
      if(after)after();else render();
      toast(ok?"Записано":"Остаток не изменился");
    };
    upd();
  });

function fieldH(label,inner,hint){return `<label class="field"><span>${label}</span>${inner}${hint?`<small>${hint}</small>`:""}</label>`}
function editMat(c,id){
  const isNew=!id,src=id?find(c,id):null;
  const it=src?{...src}:c==="plastics"?{type:"PLA Basic",color:"",hex:"#3a7bd5",brand:"Bambu Lab",spool:1000,min:500,qty:0,pk:S.p.ppk}:{name:"",unit:"шт",min:50,qty:0,price:0};
  let body;
  if(c==="plastics"){
    body=`<datalist id="types">${["PLA Basic","PLA Matte","PLA Silk","PLA-CF","PETG HF","PETG Basic","PETG-CF","TPU 95A","ABS","ASA","PA6-CF","PC","PVA"].map(t=>`<option value="${t}">`).join("")}</datalist>
    <div class="grid2">${fieldH("Тип",`<input id="e_type" class="inp" list="types" value="${esc(it.type)}" autofocus>`)}${fieldH("Цвет",`<input id="e_color" class="inp" value="${esc(it.color)}" placeholder="Например: Белый">`)}
    ${fieldH("Оттенок на кружке",`<input id="e_hex" class="inp" type="color" value="${esc(it.hex||"#888888")}">`)}${fieldH("Производитель",`<input id="e_brand" class="inp" value="${esc(it.brand)}">`)}
    ${fieldH("Цена",`<div class="suf"><input id="e_pk" class="inp" type="text" inputmode="decimal" value="${esc(dec(it.pk))}"><i>₽/кг</i></div>`,"Обновляется сама при приходе с суммой")}${fieldH("Вес катушки",`<div class="suf"><input id="e_spool" class="inp" type="text" inputmode="decimal" value="${esc(dec(it.spool||1000))}"><i>г</i></div>`)}
    ${fieldH("Минимум",`<div class="suf"><input id="e_min" class="inp" type="text" inputmode="decimal" value="${esc(dec(it.min))}"><i>г</i></div>`,"Ниже — пора заказывать")}</div>`;
  } else {
    body=fieldH("Название",`<input id="e_name" class="inp" value="${esc(it.name)}" placeholder="Например: Саморез 3×16 или Коробка 15×10×5" autofocus>`)+
    `<div class="grid3">${fieldH("Единица",`<select id="e_unit" class="inp">${["шт","м","г","уп","пар","компл"].map(x=>`<option ${x===it.unit?"selected":""}>${x}</option>`).join("")}</select>`)}${fieldH("Цена за ед.",`<div class="suf"><input id="e_price" class="inp" type="text" inputmode="decimal" value="${esc(dec(it.price))}"><i>₽</i></div>`)}${fieldH("Минимум",`<input id="e_min" class="inp" type="text" inputmode="decimal" value="${esc(dec(it.min))}">`)}</div>`;
  }
  if(isNew)body+=fieldH("Сейчас на складе, "+(c==="plastics"?"г":"ед."),`<input id="e_start" class="inp" type="text" inputmode="decimal" placeholder="0">`,"Запишется в журнал как начальный остаток");
  openSheet(`<h2>${isNew?(c==="plastics"?"Новый пластик":"Новая деталь или упаковка"):"Изменить"}</h2>${body}
    <div class="row2"><button type="button" class="btn main" id="e_ok">${isNew?"Добавить":"Сохранить"}</button><button type="button" class="btn" id="e_cancel">Отмена</button></div>`,s=>{
    s.querySelector("#e_cancel").onclick=()=>isNew?closeSheet():openMat(c,id);
    s.querySelector("#e_ok").onclick=()=>{
      const v=k=>{const e=s.querySelector("#e_"+k);return e?e.value.trim():""};
      const mn=num(v("min"));it.min=mn>=0?mn:0;
      if(c==="plastics"){it.type=v("type")||"PLA";it.color=v("color");it.hex=v("hex");it.brand=v("brand");const sp=num(v("spool"));it.spool=sp>0?sp:1000;const pk=num(v("pk"));it.pk=pk>0?pk:S.p.ppk;it.name=(it.type+" "+it.color).trim()}
      else{it.name=v("name");it.unit=v("unit")||"шт";const pr=num(v("price"));it.price=pr>0?pr:0}
      if(!it.name||(c==="plastics"&&!it.color)){toast(c==="plastics"?"Укажите цвет":"Укажите название");return}
      if(isNew){it.id=uid();it.qty=0;S[c].push(it);const st=num(v("start"));if(st>0)commit("Начальный остаток: "+it.name,[{c,id:it.id,d:st}]);else save();closeSheet();render();toast("Добавлено")}
      else{Object.assign(src,it);save();render();openMat(c,id);toast("Сохранено")}
    };
  });
}

function normUrl(u){u=String(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return ""}}

function linksHtml(p){const L=prodLinks(p);return L.length?`<div class="chips" style="margin-top:8px">${L.map(l=>`<a class="chip" href="${esc(normUrl(l.u))}" target="_blank" rel="noopener noreferrer">${esc(l.t||"Ссылка")} ↗</a>`).join("")}</div>`:""}

function readForm(){

const WBC="master3d_wbcache";
const MODEL_TXT={fbs:"FBS",dbs:"DBS",edbs:"DBS экспресс",fbw:"FBW"};
const MODEL_COL={fbs:3,dbs:4,edbs:5,fbw:6};
let wbCache=null;
function wbLoadCache(){if(wbCache)return wbCache;try{wbCache=JSON.parse(localStorage.getItem(WBC)||"null")}catch(e){wbCache=null}return wbCache}
function wbSaveCache(c){wbCache=c;try{localStorage.setItem(WBC,JSON.stringify(c))}catch(e){}}
function wbSubj(id){const c=wbLoadCache();if(!c)return null;const r=c.subjects.find(x=>x[0]===id);return r?{id:r[0],name:r[1],parent:r[2],row:r}:null}
function wbRate(row,model){const v=row[MODEL_COL[model||S.wbcfg.model]];return v===null||v===""||v===undefined?null:+v}
function wbWarehouse(c,name){c=c||wbLoadCache();if(!c||!c.warehouses||!c.warehouses.length)return null;
  return c.warehouses.find(w=>w.name===name)||c.warehouses.find(w=>/маркетплейс/i.test(w.name))||c.warehouses[0]}
function wbT(w,vol,model){if(!w)return NaN;const fb=(model||S.wbcfg.model)==="fbw";const b1=fb?w.fbw1:w.fbs1,bl=fb?w.fbwL:w.fbsL;if(!(b1>0))return NaN;return b1+(bl>0?bl:0)*Math.max(0,(vol>0?vol:1)-1)}
async function wbFetch(){
  const url=(S.wbcfg.url||"").trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))throw new Error("Вставьте адрес веб-приложения из Google (начинается с https://script.google.com/…/exec)");
  const ids=[...new Set(S.products.filter(p=>p.subj).map(p=>p.subj.id))].join(",");
  const q=`?model=${encodeURIComponent(S.wbcfg.model)}&wh=${encodeURIComponent(S.wbcfg.wh||"")}${ids?"&track="+ids:""}`;
  let res;
  try{res=await fetch(url+q,{method:"GET",redirect:"follow"})}catch(e){throw new Error("Нет связи со скриптом. Проверьте интернет и что веб-приложение открыто для «Все».")}
  let d;try{d=await res.json()}catch(e){throw new Error("Скрипт ответил не данными. Проверьте, что в развертывании выбрано «Веб-приложение» и доступ «Все».")}
  if(!d||!d.ok)throw new Error(d&&d.error?d.error:"Скрипт вернул ошибку");
  const c={updated:d.updated||"",fetched:Date.now(),subjects:d.subjects||[],warehouses:d.warehouses||[]};
  wbSaveCache(c);
  if(!S.wbcfg.wh){const w=wbWarehouse(c,"");if(w)S.wbcfg.wh=w.name}
  return c;
}
function wbPropose(c){
  const out=[],cur=wbWarehouse(c,S.wbcfg.wh),snap=S.wbSnap;
  const logOk=!!(snap&&cur&&snap.name===cur.name&&snap.model===S.wbcfg.model);
  for(const p of S.products){
    if(!p.wb)continue;const ch={p,before:calc(p)};
    if(p.subj){const r=c.subjects.find(x=>x[0]===p.subj.id);if(r){const v=wbRate(r);if(v!==null&&Math.abs(v/100-p.wb.comm)>1e-9)ch.comm=[p.wb.comm,v/100]}else ch.lost=true}
    if(logOk&&p.autoLog!==false){const o=wbT(snap,p.vol),n=wbT(cur,p.vol);if(o>0&&n>0&&Math.abs(n-o)>1e-9){const lb=p.wb.lb>0?p.wb.lb:S.p.lb;ch.lb=[lb,Math.round(lb*n/o*100)/100]}}
    if(ch.comm||ch.lb){const t=JSON.parse(JSON.stringify(p));if(ch.comm)t.wb.comm=ch.comm[1];if(ch.lb)t.wb.lb=ch.lb[1];ch.after=calc(t);out.push(ch)}
  }
  return {list:out,cur,logOk,first:!snap||!cur||snap.name!==cur.name||snap.model!==S.wbcfg.model};
}
function wbApply(pr){
  for(const ch of pr.list){if(ch.comm)ch.p.wb.comm=ch.comm[1];if(ch.lb)ch.p.wb.lb=ch.lb[1]}
  if(pr.cur)S.wbSnap={name:pr.cur.name,model:S.wbcfg.model,fbs1:pr.cur.fbs1,fbsL:pr.cur.fbsL,fbw1:pr.cur.fbw1,fbwL:pr.cur.fbwL,date:Date.now()};
  S.wbcfg.last=new Date().toISOString();
  if(pr.list.length)S.log.unshift({id:uid(),t:Date.now(),text:`Тарифы WB: обновлено изделий — ${pr.list.length}`,changes:[],isUndo:true,
    note:pr.list.map(ch=>ch.p.name+": "+[ch.comm?`комиссия ${pct(ch.comm[0])} → ${pct(ch.comm[1])}`:"",ch.lb?`логистика ${n1(ch.lb[0],2)} → ${n1(ch.lb[1],2)} ₽`:""].filter(Boolean).join(", ")).join("; ")});
  save();
}

    ${b&&a?`<div class="ln"><span>Прибыль / шт</span><span>${rub(b.Q)} → <b class="${a.Q<b.Q?"minus":"plus"}">${rub(a.Q)}</b></span></div>`:""}</div>`}).join("");

async function syncPush(o={}){

    if(d&&d.ok){SY.base=d.rev;SY.pushedRev=rev;SY.localRev=Math.max(SY.localRev,rev);SY.lastPush=Date.now();SY.err="";syncConflict=null;ok=true}
    else if(d&&d.error==="conflict"){syncConflict=d;SY.err="";if(view!=="prod")renderMain()}

function salesAgg(rows){
  const P=S.p,by={};let tot={n:0,r:0,rev:0,pay:0,profit:0,unmatched:0};
  for(const o of rows){
    const p=matchProd(o),key=p?p.id:"nm"+o.nm;
    const a=by[key]||(by[key]={p,o,n:0,r:0,rev:0,pay:0,profit:p?0:null});
    a.n+=o.n;a.r+=o.r;a.rev+=o.rev;a.pay+=o.pay;
    if(p){const net=o.n-o.r,w=p.wb||{},L=(w.lb>0?w.lb:P.lb)/(w.buy>0?w.buy:P.buy),ads=w.ads!=null?w.ads:P.ads;
      a.profit+=o.pay-net*L-ads*o.rev-P.tax*o.rev-net*cost(p).total}

  const list=Object.values(by).sort((a,b)=>b.rev-a.rev);
  for(const a of list){tot.n+=a.n;tot.r+=a.r;tot.rev+=a.rev;tot.pay+=a.pay;if(a.p)tot.profit+=a.profit;else tot.unmatched+=a.n-a.r}

function loadXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok(window.XLSX);const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=()=>ok(window.XLSX);sc.onerror=()=>no(new Error("Не удалось загрузить модуль чтения Excel. Нужен интернет."));document.head.appendChild(sc)})}
function expCat(name){const n=String(name).toLowerCase();if(/кабинет|регистрац|открыти/.test(n))return "Запуск бизнеса";if(/пластин|принтер|стол|сушил|сопл/.test(n))return "Оборудование";if(/расходник/.test(n))return "Расходники";return "Разработка моделей"}
function toDate(v){
  if(v instanceof Date&&!isNaN(v))return v;
  if(typeof v==="number"&&v>20000&&v<80000)return new Date(Math.round((v-25569)*86400000)+new Date().getTimezoneOffset()*60000);
  const s=String(v==null?"":v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],12);
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(m)return new Date(+(m[3].length===2?"20"+m[3]:m[3]),+m[2]-1,+m[1],12);
  return null;
}
function parseHistory(rows){
  const cs=v=>String(v==null?"":v).trim();
  const res={mode:null,inc:[],months:[],exp:[],skipped:0,skippedProfit:0,first:null};
  /* формат 1: построчные заказы — Статус, Дата, Наименование, Кол-во, Прибыль, Розничная цена */
  const h=rows.findIndex(r=>r&&r.some(c=>/^дата$/i.test(cs(c)))&&r.some(c=>/прибыл/i.test(cs(c)))&&r.some(c=>/наименован|номенклатур/i.test(cs(c))));
  if(h>=0){
    const hr=rows[h].map(cs),col=re=>hr.findIndex(c=>re.test(c));
    const cSt=col(/статус/i),cD=col(/^дата$/i),cN=col(/наименован|номенклатур/i),cQ=col(/кол-во|количеств/i),cP=col(/прибыл/i),cR=col(/розничн|выручк|сумма/i);
    const by={};
    for(let i=h+1;i<rows.length;i++){const r=rows[i]||[];const nm=cs(r[cN]);const d=toDate(r[cD]);const p=Number(r[cP]);
      if(!nm||!d||!isFinite(p))continue;
      const st=cSt>=0?cs(r[cSt]):"Оплачен";
      if(!/оплач/i.test(st)){res.skipped++;res.skippedProfit+=p;continue}
      const m=mk(d.getTime());const o=by[m]||(by[m]={m,profit:0,q:0,rev:0,n:0,last:0});
      o.profit+=p;o.q+=Number(r[cQ])||0;o.rev+=Number(r[cR])||0;o.n++;o.last=Math.max(o.last,d.getTime());
      if(!res.first||d<res.first)res.first=d;
    }
    res.months=Object.values(by).sort((a,b)=>a.m<b.m?-1:1).map(o=>({...o,profit:Math.round(o.profit*100)/100,rev:Math.round(o.rev*100)/100}));
    if(res.months.length)res.mode="rows";
  }
  /* формат 2: сводная — Номенклатура, Кол-во, Чистая прибыль */
  if(!res.mode){
    const p=rows.findIndex(r=>r&&r.some(c=>/номенклатур/i.test(cs(c))));
    if(p>=0){const hr=rows[p].map(cs);const ci=hr.findIndex(c=>/номенклатур/i.test(c)),cq=hr.findIndex(c=>/кол-во|количеств/i.test(c)),cp=hr.findIndex(c=>/прибыл/i.test(c));
      for(let i=p+1;i<rows.length;i++){const r=rows[i]||[];const nm=cs(r[ci]);if(!nm)continue;if(/общий итог|^итого|^расходы$/i.test(nm))break;
        const pv=Number(r[cp]);if(isFinite(pv)&&pv)res.inc.push({name:nm,q:Number(r[cq])||0,profit:Math.round(pv*100)/100})}
      if(res.inc.length)res.mode="pivot"}
  }
  /* блок «Расходы»: в любом месте листа, название и сумма в соседних колонках */
  for(let i=0;i<rows.length;i++){const r=rows[i]||[];const j=r.findIndex(c=>/^расходы$/i.test(cs(c)));if(j<0)continue;
    for(let k=i+1;k<rows.length;k++){const rr=rows[k]||[];const nm=cs(rr[j]);if(!nm)break;const v=Number(rr[j+1]);if(isFinite(v)&&v>0)res.exp.push({name:nm,amount:Math.round(v*100)/100,cat:expCat(nm)})}
    break}
  return res;
}

function doubleCount(p){
  const out=[];const st=w=>String(w||"").toLowerCase().replace(/ё/g,"е").split(/[^а-яa-z0-9]+/).filter(x=>x.length>=4).map(x=>x.slice(0,5));
  if(p.g0>0&&p.rec.pl.some(r=>r.q>0))out.push("пластик есть и в составе, и «без привязки»");
  for(const e of p.ex||[]){if(!(e.v>0))continue;const ws=st(e.n);
    const hit=p.rec.pt.find(r=>{const m=find("parts",r.id);if(!m||!(r.q>0))return false;const mw=st(m.name);return ws.some(w=>mw.includes(w))});
    if(hit)out.push(`«${e.n}» и «${find("parts",hit.id).name}»`)}
  return out;
}
function buyerByName(n){n=String(n||"").trim().toLowerCase();return n?S.buyers.find(b=>b.name.toLowerCase()===n)||null:null}
function baseOpt(p){if(p.opt>0)return {v:p.opt,src:"базовая оптовая цена"};const r=calc(p);if(r.w){return {v:wholesale(r.c.total,r.w.G,p.wb.comm,r.w.L,0.07).opt,src:"расчётная оптовая цена"}}return null}
function buyerPrice(b,p){
  if(b.prices&&b.prices[p.id]>0)return {price:b.prices[p.id],src:"цена из прайса покупателя"};
  const base=baseOpt(p);if(!base)return null;
  if(b.disc>0)return {price:Math.round(base.v*(1-b.disc)),src:`${base.src} ${rub(base.v)} − скидка ${pct(b.disc,1)}`};
  return {price:base.v,src:base.src};
}
function dealProfit(d){const c=d.cost!=null?d.cost:(find("products",d.pid)?cost(find("products",d.pid)).total*d.q:0);return d.sum-c-d.sum*(d.tax||0)}
function buyerStats(b,m){

  return {n:ds.length,q:ds.reduce((a,d)=>a+d.q,0),sum:ds.reduce((a,d)=>a+d.sum,0),profit:ds.reduce((a,d)=>a+dealProfit(d),0),debt:ds.filter(d=>!d.paidAt).reduce((a,d)=>a+d.sum,0),unpaid:ds.filter(d=>!d.paidAt),ds,last:ds.length?Math.max(...ds.map(d=>d.t)):null};
}

function payDeal(id){const d=S.deals.find(x=>x.id===id);if(!d||d.paidAt)return;d.paidAt=Date.now();S.money.push({id:uid(),t:Date.now(),type:"in",cat:"Опт",amount:d.sum,note:`${d.buyer}: ${d.name} × ${n1(d.q)}`,ref:d.id});save();toast("Оплата записана в кассу")}

const NPD_LIMIT=2400000;
function taxMonth(m){
  const c=salesLoad();let wb=null;
  if(c&&c.rows&&c.months&&c.months.includes(m))wb=c.rows.filter(r=>r.m===m).reduce((a,r)=>a+r.rev,0);
  const ds=S.deals.filter(d=>mk(d.t)===m);
  const b6=ds.filter(d=>d.tax===0.06).reduce((a,d)=>a+d.sum,0),b4o=ds.filter(d=>d.tax===0.04).reduce((a,d)=>a+d.sum,0),b0=ds.filter(d=>!d.tax).reduce((a,d)=>a+d.sum,0);
  const hist=S.money.filter(x=>x.taxRate&&mk(x.t)===m&&String(x.ref||"").startsWith("hist:m"));
  const h4=hist.filter(x=>x.taxRate===0.04).reduce((a,x)=>a+(x.rev||0),0),h6=hist.filter(x=>x.taxRate===0.06).reduce((a,x)=>a+(x.rev||0),0);
  const b4o2=b4o+h4,b6b=b6+h6;
  return taxMonthRes(m,wb,b4o2,b6b,b0);
}
function taxMonthRes(m,wb,b4o,b6,b0){
  const b4=(wb||0)+b4o;
  return {m,wb,b4o,b4,b6,b0,gross:b4*0.04+b6*0.06,bonusMax:b4*0.01+b6*0.02,paid:S.tax.paid[m]||null};
}
function taxPlan(){
  const cm=curM(),months=[];for(let i=0;i<7;i++)months.push(prevM(cm,i));
  const list=months.map(taxMonth);
  let avail=S.tax.bonus>0?S.tax.bonus:0;
  for(const t of list.slice().reverse()){if(t.paid){t.bonus=t.paid.bonusUsed||0;t.tax=t.paid.amount;continue}const u=Math.min(avail,t.bonusMax);avail-=u;t.bonus=u;t.tax=Math.max(0,t.gross-u)}
  return list;
}
function dueText(m){const n=prevM(m,-1);const [y,mm]=n.split("-");return `до 28 ${["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"][+mm-1]}`}
function yearIncome(){
  const y=String(new Date().getFullYear());let v=0;
  const c=salesLoad();if(c&&c.rows)c.rows.filter(r=>r.m.startsWith(y)).forEach(r=>v+=r.rev);
  S.deals.filter(d=>d.tax&&new Date(d.t).getFullYear()===+y).forEach(d=>v+=d.sum);
  S.money.filter(x=>x.taxRate&&String(x.ref||"").startsWith("hist:m")&&new Date(x.t).getFullYear()===+y).forEach(x=>v+=x.rev||0);
  return v;
}
function taxDue(){
  const t=taxPlan().find(x=>x.m===prevM(curM(),1));
  if(!t||t.paid||!(t.tax>0))return null;return t;
}

/* ================= заказы WB FBS и что печатать ================= */
/* ===== Планировщик печати (одинаковый в приложении и в Google-скрипте) =====
 * products: [{id,name,qty,min,h,pl:[{id,q}],perH,rate,plate,plateH}]  rate — расход в день, perH — прибыль за час печати,
 *   plate — сколько штук помещается на стол, plateH — время печати всего стола (если пусто — h × plate)
 * plastics: [{id,name,qty,min}]
 * opt: {hours, days}  hours — сколько часов печати есть, days — на сколько дней держать запас
 */
function planPrint(products, plastics, opt) {
  var hoursLeft = opt.hours, days = opt.days || 14;
  var stockPl = {}; plastics.forEach(function (m) { stockPl[m.id] = Math.max(0, m.qty || 0); });
  var plName = {}; plastics.forEach(function (m) { plName[m.id] = m.name; });
  var cand = products.filter(function (p) { return p.h > 0; }).map(function (p) {
    var rate = p.rate > 0 ? p.rate : 0, qty = Math.max(0, p.qty || 0);
    var target = Math.max(p.min || 0, Math.ceil(rate * days));
    var need = Math.max(0, target - qty);
    var daysLeft = rate > 0 ? qty / rate : (qty < (p.min || 0) ? days : Infinity); /* без продаж — после тех, что продаются */
    return { p: p, rate: rate, qty: qty, need: need, daysLeft: daysLeft, target: target };
  }).filter(function (c) { return c.need > 0; });
  cand.sort(function (a, b) {
    var ua = Math.min(a.daysLeft, 999), ub = Math.min(b.daysLeft, 999);
    if (Math.floor(ua) !== Math.floor(ub)) return ua - ub;
    return (b.p.perH || 0) - (a.p.perH || 0);
  });
  var items = [], skipped = [];
  cand.forEach(function (c) {
    var p = c.p;
    var per = p.plate > 1 ? Math.floor(p.plate) : 1, ph = p.plateH > 0 ? p.plateH : p.h * per;
    var fresh = hoursLeft >= opt.hours - 1e-9; /* стол длиннее рабочего дня можно поставить, если день ещё пустой */
    var byTime = Math.floor(hoursLeft / ph + 1e-9);
    if (byTime < 1 && fresh && hoursLeft > 0) byTime = 1;
    if (byTime < 1) { skipped.push({ name: p.name, need: c.need, reason: per > 1 ? 'стол не помещается по времени' : 'не хватает времени' }); return; }
    var plates = Math.min(Math.ceil(c.need / per), byTime), shortPl = null;
    (p.pl || []).forEach(function (r) {
      if (!(r.q > 0)) return;
      var can = Math.floor((stockPl[r.id] || 0) / (r.q * per) + 1e-9);
      if (can < plates) { plates = can; shortPl = plName[r.id] || 'пластик'; }
    });
    if (plates <= 0) { skipped.push({ name: p.name, need: c.need, reason: 'не хватает: ' + (shortPl || 'пластик') }); return; }
    var n = plates * per;
    var used = [];
    (p.pl || []).forEach(function (r) { if (r.q > 0) { stockPl[r.id] -= r.q * n; used.push({ name: plName[r.id] || 'пластик', g: Math.round(r.q * n) }); } });
    hoursLeft = Math.max(0, hoursLeft - plates * ph);
    items.push({ id: p.id, name: p.name, n: n, plates: plates, per: per, long: ph > opt.hours, hours: Math.round(plates * ph * 100) / 100, plastic: used, qty: c.qty, rate: c.rate,
      daysLeft: c.daysLeft, perH: p.perH, short: shortPl && n < c.need ? shortPl : null, need: c.need });
  });
  var warn = [];
  plastics.forEach(function (m) {
    var left = stockPl[m.id] || 0;
    if ((m.min || 0) > 0 && left < m.min) warn.push({ name: m.name, left: Math.round(left), min: m.min });
  });
  return { items: items, skipped: skipped, warn: warn, hoursUsed: Math.round((opt.hours - hoursLeft) * 100) / 100, hours: opt.hours };
}

/* Списывает новые заказы и возвращает отменённые до отправки. Возвращает число списанных. */
function ordersApply(){
  const c=ordLoad();if(!c||!S.ordCfg.on)return 0;
  const start=S.ordCfg.start||0,A=S.ordApplied,B=S.ordBack,out={},back={},ids=[],bids=[];let n=0;
  for(const o of c.rows){const t=Date.parse(o.at);if(!(t>=start))continue;const id=String(o.id),canc=cancelledBeforeShip(o.sup,o.wb);
    if(!A[id]){if(canc)continue;const p=matchProd(o);if(!p)continue;out[p.id]=(out[p.id]||0)+1;A[id]=t;ids.push(id);n++}
    else if(canc&&!B[id]){const p=matchProd(o);if(!p)continue;back[p.id]=(back[p.id]||0)+1;B[id]=t;bids.push(id)}}
  const lim=Date.now()-90*86400000;for(const k in A)if(A[k]<lim){delete A[k];delete B[k]}
  const nm=o=>Object.entries(o).map(([id,q])=>{const p=find("products",id);return (p?p.name:"?")+" × "+q}).join(", ");
  if(ids.length){const e=commit("Заказы WB: "+nm(out),Object.entries(out).map(([id,q])=>({c:"products",id,d:-q})),"Автосписание, заказов: "+ids.length);if(e)e.auto="wbord"}
  if(bids.length){const e=commit("Отмена заказов WB: "+nm(back),Object.entries(back).map(([id,q])=>({c:"products",id,d:q})),"Покупатель отменил до отправки");if(e)e.auto="wbord"}
  if(ids.length||bids.length)save();
  return n;
}

/* Продаж в день за 30 дней: по заказам FBS, если их нет — по продажам WB, иначе план на месяц / 30 */
function ordRate(){
  const rate={},now=Date.now(),d30=now-30*86400000,c=ordLoad();let have=false;
  if(c&&c.rows&&c.rows.length)for(const o of c.rows){const t=Date.parse(o.at);if(t<d30)continue;const p=matchProd(o);if(!p)continue;have=true;if(!cancelledBeforeShip(o.sup,o.wb))rate[p.id]=(rate[p.id]||0)+1}
  let days=30;
  if(!have){const sc=salesLoad();if(sc&&sc.rows){const m0=curM(),m1=prevM(m0,1),[y,mm]=m1.split("-").map(Number);days=new Date().getDate()+new Date(y,mm,0).getDate();
    for(const r of sc.rows){if(r.m!==m0&&r.m!==m1)continue;const p=matchProd(r);if(!p)continue;rate[p.id]=(rate[p.id]||0)+(r.n-r.r)}}}
  const out={};for(const p of S.products){const k=have?Math.min(1,p.wb&&p.wb.buy>0?p.wb.buy:S.p.buy):1;out[p.id]=rate[p.id]>0?rate[p.id]*k/days:(p.plan||0)/30}
  return {rate:out,src:have?"orders":"sales"};
}

function printHours(m){
  let h=0,def=0;
  for(const e of S.log){if(mk(e.t)!==m||e.undone||e.isUndo)continue;
    if(e.hours!=null){h+=e.hours;def+=e.def||0;continue}
    if(/^Напечатано:/.test(e.text)&&e.changes[0]&&e.changes[0].c==="products"){const p=find("products",e.changes[0].id);h+=e.changes[0].d*((p&&p.h)||0)}}
  return {h,def};
}

  const cap=(S.p.printers||1)*24*days,target=cap*S.p.load,cur=printHours(m),prev=printHours(prevM(m,1));
  const pace=cur.h/Math.max(1,dayNow)*days;

function planUpdate(){
  let hours=0,profit=0,pcs=0,toPrint=0,g0=0;const need={plastics:{},parts:{}};
  for(const x of S.products){const q=x.plan||0;if(!q)continue;const r=calc(x);pcs+=q;if(r.w)profit+=q*r.w.Q;
    const pr=Math.max(0,q-Math.max(0,x.qty));toPrint+=pr;hours+=pr*(x.h||0);g0+=pr*(x.g0||0);
    for(const r2 of x.rec.pl)need.plastics[r2.id]=(need.plastics[r2.id]||0)+pr*r2.q;
    for(const r2 of x.rec.pt)need.parts[r2.id]=(need.parts[r2.id]||0)+pr*r2.q;}
  const cap=24*30*S.p.load,printers=hours/cap;
  const el=$("#planRes");if(!el)return;
  el.innerHTML=`<div class="kpis"><div class="kpi"><span>Прибыль в месяц</span><b>${rub(profit)}</b><small>продать ${n1(pcs,0)} шт</small></div><div class="kpi"><span>Напечатать</span><b>${n1(toPrint,0)} шт</b><small>${n1(hours,0)} ч печати</small></div><div class="kpi"><span>Принтеров</span><b>${toPrint?Math.max(1,Math.ceil(printers-1e-9)):0}</b><small>${toPrint?"загрузка "+pct(printers,0)+" одного":"введите план"}</small></div></div>`;
  const rows=[];
  for(const c of ["plastics","parts"])for(const id in need[c]){const m=find(c,id);if(!m)continue;const n=need[c][id],buy=Math.max(0,n-Math.max(0,m.qty));
    const price=c==="plastics"?(m.pk>0?m.pk:S.p.ppk)/1000:(m.price||0);rows.push({m,c,n,buy,cost:buy*price})}
  rows.sort((a,b)=>b.buy-a.buy);
  const buySum=rows.reduce((a,r)=>a+r.cost,0)+g0*S.p.ppk/1000;
  $("#needSec").innerHTML=`<h2>Материалы под план <small>докупить на ${rub(buySum)}</small></h2>${rows.length||g0?`<div class="scroll"><table class="t"><thead><tr><th>Материал</th><th>Нужно</th><th>Есть</th><th>Докупить</th></tr></thead><tbody>${rows.map(r=>{const u=unitOf(r.c,r.m);return `<tr><td>${esc(r.m.name)}</td><td>${n1(r.n,0)} ${esc(u)}</td><td>${n1(r.m.qty,0)}</td><td class="${r.buy>0?"neg":""}">${r.buy>0?n1(r.buy,0)+" "+esc(u):"хватает"}</td></tr>`}).join("")}${g0?`<tr><td>Пластик без привязки к складу</td><td>${n1(g0,0)} г</td><td>—</td><td class="neg">${n1(g0,0)} г</td></tr>`:""}</tbody></table></div><p class="hint">Пластик: 1 катушка ≈ 1000 г. Чтобы точно знать, какой цвет докупать, добавьте пластик в состав изделий.</p>`:`<p class="hint">Введите план ниже — здесь появится, сколько пластика и деталей нужно и чего не хватает на складе.</p>`}`;
}

  const tp=e.target.closest("[data-todo]");if(tp){const n=+tp.dataset.n;openAction("products",tp.dataset.todo,"print");const i=$("#a_n");if(i&&n>0){i.value=String(n);i.dispatchEvent(new Event("input",{bubbles:true}))}return}
  const mt=e.target.closest("[data-mat]");if(mt){matTab=mt.dataset.mat;onlyLow=false;render();return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="hideNotice"){delete S.notice;save();renderMain()}
  if(act==="syncOn")syncEnable(a);
  if(act==="syncRestore")openKeySheet(false);
  if(act==="syncNow"){a.disabled=true;a.textContent="Сохраняю…";SY.localRev=Math.max(SY.localRev,Date.now());syncPush().then(ok=>{toast(ok?"Сохранено в Google":SY.err||"Не получилось");renderMain()})}
  if(act==="syncPullAsk")confirmSheet("Загрузить из Google?","Данные на этом телефоне заменятся тем, что сохранено в таблице.","Загрузить",async()=>{try{await syncPull();view="products";render();toast("Данные загружены")}catch(e){toast(e.message)}},false);
  if(act==="syncPull")confirmSheet("Загрузить из Google?","Данные на этом телефоне заменятся более новыми из таблицы.","Загрузить",async()=>{try{await syncPull();view="products";render();toast("Данные загружены")}catch(e){toast(e.message)}},false);
  if(act==="syncForce")confirmSheet("Оставить данные телефона?","Данные в Google заменятся тем, что сейчас на этом телефоне.","Заменить в Google",async()=>{SY.localRev=Date.now();const ok=await syncPush({force:true});syncConflict=null;renderMain();toast(ok?"Сохранено в Google":SY.err)});
  if(act==="syncOff")confirmSheet("Выключить синхронизацию?","Данные в Google останутся, но новые изменения туда сохраняться не будут.","Выключить",()=>{SY.on=false;saveSync();topBar();renderMain();toast("Синхронизация выключена")});
  if(act==="salesFetch")salesFetch(a);
  if(act==="ordOn")confirmSheet("Включить автосписание?","Каждый новый заказ WB FBS будет списывать 1 шт со склада. Заказы, сделанные до этой минуты, не тронутся. Для работы в ключе WB нужна категория «Маркетплейс».","Включить",async()=>{S.ordCfg.on=true;S.ordCfg.start=Date.now();save();renderMain();const r=await ordersFetch(true);toast(r&&r.err?r.err:"Автосписание включено");renderMain()},false);
  if(act==="ordOff")confirmSheet("Выключить автосписание?","Заказы WB перестанут списываться со склада. Уже списанное останется.","Выключить",()=>{S.ordCfg.on=false;save();renderMain();toast("Автосписание выключено")});
  if(act==="ordNow"){a.disabled=true;a.textContent="Проверяю…";ordersFetch(true).then(r=>{toast(r&&r.err?r.err:r&&r.n?`Списано заказов: ${r.n}`:"Новых заказов нет");renderMain()})}
  if(act==="planMail"){S.ordCfg.planMail=!S.ordCfg.planMail;save();renderMain();toast(S.ordCfg.planMail?"План будет приходить в 17:30":"Письма с планом выключены")}
  if(act==="goPlan"){view="plan";salesTab="plan";render()}
  if(act==="goCash"){view="plan";salesTab="cash";render()}
  if(act==="goSales"){view="plan";salesTab="sales";render()}
  if(act==="wLow"){if(lowCount("products")){prodSort="attention";onlyLow=true;renderMain()}else if(lowCount("plastics")||lowCount("parts")){view="materials";matTab=lowCount("plastics")?"plastics":"parts";onlyLow=true;render()}else toast("Всё в норме")}
  if(act==="opAdd")openOpForm();
  if(act==="buyers")openBuyers();
  if(act==="opWB")openOpForm({type:"in",cat:"Выплата WB"});
  if(act==="goTax"){view="plan";salesTab="tax";render()}
  if(act==="pbAdd"){const pr=num($("#pb_price").value);if(!(pr>0)){toast("Укажите цену принтера");return}const dv=$("#pb_date").value;S.money.push({id:uid(),t:dv?new Date(dv+"T12:00:00").getTime():Date.now(),type:"out",cat:"Оборудование",amount:pr,note:$("#pb_name").value.trim()||"Принтер"});save();renderMain();toast("Добавлено")}
  if(act==="goMore"){view="more";render()}
  if(act==="wbUpdate")wbUpdate(a);
  if(act==="wbConnect"){const u=$("#wb_url").value.trim();if(u!==S.wbcfg.url){S.wbcfg.url=u;save()}if(!u){toast("Вставьте адрес веб-приложения");return}a.disabled=true;a.textContent="Подключаю…";wbUpdate(null).then(()=>{if(view==="more")renderMain()})}
  if(act==="wbOff")confirmSheet("Отключить тарифы WB?","Автообновление в приложении выключится. Предметы у изделий сохранятся, скрипт в Google продолжит присылать письма.","Отключить",()=>{S.wbcfg={...WBCFG_DEF};S.wbSnap=null;wbSaveCache(null);try{localStorage.removeItem(WBC)}catch(e){}save();renderMain();toast("Отключено")});
  if(act==="onlyLow"){onlyLow=!onlyLow;renderMain()}
  if(act==="allMat"){onlyLow=false;renderMain()}
  if(act==="exportJson"){download(`masterskaya-${stamp()}.json`,JSON.stringify(S),"application/json");markBackup();toast("Файл сохранён в «Загрузки»");renderMain()}
  if(act==="copyJson"){copy(JSON.stringify(S),"Копия в буфере. Вставьте её в «Избранное» Telegram");markBackup()}
  if(act==="exportCsv"){download(`masterskaya-${stamp()}.csv`,csv(";"),"text/csv");toast("Таблица сохранена в «Загрузки»")}
  if(act==="copyCsv")copy(csv("\t"),"Таблица скопирована. Вставьте её в Excel");
  if(act==="pasteImport"){const t=$("#pasteIn").value.trim();t?handleImport(t):toast("Сначала вставьте текст копии")}
  if(act==="doMigrate")confirmSheet("Перенести данные?","Текущие данные приложения заменятся данными из старых копий.","Перенести",()=>{S=normalize(migrate(pend.sk,pend.ce));pend={sk:null,ce:null};save();view="products";render();toast("Данные перенесены")},false);
  if(act==="resetP")confirmSheet("Вернуть параметры?","Все параметры станут как в вашей таблице.","Вернуть",()=>{S.p={...DEF};save();renderMain();toast("Параметры восстановлены")});
  if(act==="wipe")confirmSheet("Очистить всё?","Удалятся изделия, материалы и журнал. Вернуть можно только из копии.","Очистить",()=>{S=normalize({v:2,p:S.p,wbcfg:S.wbcfg,ui:S.ui,products:[],plastics:[],parts:[],log:[]});S.wbSnap=null;save();view="products";render();toast("Очищено")});
});
$("#main").addEventListener("change",e=>{
  if(e.target.id==="wb_url"){const nu=e.target.value.trim();if(nu!==S.wbcfg.url){S.wbcfg.url=nu;save();renderMain()}}
  if(e.target.dataset&&e.target.dataset.wdg){const k=e.target.dataset.wdg;let w=(S.ui.widgets||[]).filter(x=>x!==k);if(e.target.checked){w.push(k);w=WIDGETS.map(x=>x[0]).filter(x=>w.includes(x))}S.ui.widgets=w;save();toast(e.target.checked?"Виджет добавлен на главный экран":"Виджет убран")}
  if(e.target.id==="ui_iconcolor"){S.ui.iconColor=e.target.value;save();applyIcon();renderMain();toast("Цвет ярлыка выбран")}
  if(e.target.id==="tax_bonus"){const v=num(e.target.value);S.tax.bonus=isFinite(v)&&v>=0?v:null;save();renderMain();toast("Остаток вычета сохранён")}
  if(e.target.id==="wb_wh"){S.wbcfg.wh=e.target.value;save();toast("Склад выбран. Тариф запомнится при следующем обновлении")}
  if(e.target.id==="wb_model"){S.wbcfg.model=e.target.value;save();renderMain();toast("Схема изменена")}
  if(e.target.id==="histIn"){const f=e.target.files[0];if(f)importHistoryFile(f);e.target.value=""}
  if(e.target.id==="fileIn"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>handleImport(String(r.result));r.readAsText(f);e.target.value=""}
  if(e.target.dataset&&e.target.dataset.p){const v=num(e.target.value);if(isFinite(v)&&v>=0){S.p[e.target.dataset.p]=v/(+e.target.dataset.m);save();toast("Сохранено, всё пересчитано")}else{toast("Введите число");e.target.value=String(Math.round(S.p[e.target.dataset.p]*e.target.dataset.m*1000)/1000).replace(".",",")}}
});
$("#main").addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.plan){const it=find("products",e.target.dataset.plan);const v=num(e.target.value);it.plan=v>0?v:0;save();planUpdate()}
});
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

applyTheme();
window.__m={buyFact,prodLinks,normUrl,ordersApply,ordersFetch,todayPlan,ordRate,cancelledBeforeShip,defRate,parseHistory,importHistoryFile,doubleCount,printHours,buyerPrice,buyerStats,dealProfit,payback,taxPlan,monthCash,calc,S:()=>S,migrate,wholesale,wbPropose,wbT,SY:()=>SY,salesAgg};
render();
if(SY.on)setTimeout(syncCheck,800);
document.addEventListener("visibilitychange",()=>{if(!SY.on)return;if(document.visibilityState==="hidden"){if(SY.localRev>SY.pushedRev){clearTimeout(syncTimer);syncPush()}}else syncCheck()});
})();
</script>
