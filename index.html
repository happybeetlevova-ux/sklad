<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7566">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon2-192.png"><link rel="apple-touch-icon" href="icon2-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Мастерская 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: мобильное приложение — липкая шапка, списки-строки со статусом остатка, экран изделия (склад + состав + экономика с живым расчётом), нижние шторки действий, нижняя панель вкладок */
:root{
  --bg:#edf1ef; --surface:#ffffff; --sunk:#e3e9e6; --fg:#18211f; --muted:#5a6a66; --line:#d3dbd8;
  --accent:#0d7566; --accent-fg:#ffffff; --accent-soft:#d6ece7;
  --ok:#2c7a38; --ok-soft:#dcefdf; --warn:#a8650a; --warn-soft:#f6e7cc; --bad:#bf3626; --bad-soft:#f7dcd7;
  --c1:#0d7566; --c2:#7f8fa0; --c3:#c9822a; --c4:#8e5bb5; --c5:#3d6fb8; --c6:#bf3626;
  --shadow:0 10px 30px rgba(16,40,34,.18);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Roboto Mono",monospace;
  --tabs-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --sunk:#0c1210; --fg:#e4ebe8; --muted:#93a39e; --line:#2a3632;
  --accent:#3dbba4; --accent-fg:#06221d; --accent-soft:#163a33;
  --ok:#62c070; --ok-soft:#173222; --warn:#e3a640; --warn-soft:#3a2c12; --bad:#f06e5c; --bad-soft:#3d1b16;
  --c1:#3dbba4; --c2:#6f7d8c; --c3:#e0a050; --c4:#b48ad8; --c5:#7ea2ef; --c6:#f06e5c;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --sunk:#0c1210; --fg:#e4ebe8; --muted:#93a39e; --line:#2a3632;
  --accent:#3dbba4; --accent-fg:#06221d; --accent-soft:#163a33;
  --ok:#62c070; --ok-soft:#173222; --warn:#e3a640; --warn-soft:#3a2c12; --bad:#f06e5c; --bad-soft:#3d1b16;
  --c1:#3dbba4; --c2:#6f7d8c; --c3:#e0a050; --c4:#b48ad8; --c5:#7ea2ef; --c6:#f06e5c;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.brand h1{font:700 18px/1.15 var(--f-display);margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.brand h1 span{color:var(--accent)}
.pill{font:600 12px/1 var(--f-body);padding:7px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn);border:0;white-space:nowrap}
.pill.calm{background:var(--ok-soft);color:var(--ok)}
.backbtn{border:0;background:var(--sunk);border-radius:10px;padding:8px 12px;font-weight:600;white-space:nowrap}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}

main{padding-block:14px calc(var(--tabs-h) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.banner p{margin:0}
.banner.bad{background:var(--bad-soft)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.summary{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi b{font:700 18px/1.2 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:11.5px;color:var(--muted)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:64px}
.row:last-child{border-bottom:0}
.row:active{background:var(--sunk)}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.info b{font-weight:600;overflow-wrap:anywhere}
.info small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.lead{display:flex;align-items:center;gap:10px;align-self:stretch}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--line)}
.stripe.warn{background:var(--warn)} .stripe.bad{background:var(--bad)} .stripe.ok{background:var(--ok)}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.qty{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.qty b{font:700 18px/1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.qty b small{font:500 12px var(--f-body);color:var(--muted);margin-left:3px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.ok{color:var(--ok);background:var(--ok-soft)} .tag.warn{color:var(--warn);background:var(--warn-soft)} .tag.bad{color:var(--bad);background:var(--bad-soft)} .tag.mid{color:var(--accent);background:var(--accent-soft)} .tag.mute,.tag.none{color:var(--muted);background:var(--sunk)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--tabs-h) + 16px + env(safe-area-inset-bottom,0px));z-index:6;height:56px;padding:0 22px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab span{font-size:24px;line-height:1;margin-top:-2px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabs-h)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--warn);color:var(--surface);font-size:10px;line-height:16px}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sec h2{font:700 14px/1.25 var(--f-display);margin:0;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec h2 small{font:500 12px var(--f-body);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:11.5px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0;font-variant-numeric:tabular-nums}
.inp.numbig{font:700 24px var(--f-num);text-align:center}
input[type=color].inp{height:44px;padding:4px}
.suf{position:relative}.suf .inp{padding-right:42px}.suf i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px;pointer-events:none}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.res{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:4;background:var(--fg);color:var(--bg);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:var(--shadow)}
.res div{display:flex;flex-direction:column;gap:1px;min-width:0}
.res span{font-size:11px;opacity:.7;font-weight:600}
.res b{font:700 16px/1.25 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .good{color:var(--ok-soft)}.res .poor{color:var(--warn-soft)}.res .neg{color:var(--bad-soft)}
@media (max-width:420px){.res{grid-template-columns:repeat(2,1fr)}}
.lines{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.ln{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ln>span:first-child{min-width:0;overflow-wrap:anywhere}
.ln>span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.ln small{color:var(--muted);font-size:12px}
.ln.total{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:700}
.dot2{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.stack i+i{border-left:2px solid var(--surface)}
.stockcard{display:flex;flex-direction:column;gap:12px}
.big{display:flex;align-items:baseline;gap:8px;font:700 34px/1 var(--f-num)}
.big small{font:500 14px var(--f-body);color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;font-weight:600;text-align:center}
.btn.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:var(--sunk)}
.btn.small{padding:8px 10px;font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1 1 140px}
.rec{display:grid;grid-template-columns:1fr 96px 40px;gap:6px;align-items:center}
.rec.ex{grid-template-columns:1fr 96px 40px}
.x{border:0;background:var(--sunk);border-radius:10px;height:42px;font-size:18px;color:var(--muted)}
.box{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.box h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.neg{color:var(--bad);font-weight:700}
.plus{color:var(--ok)}.minus{color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.t th{font-size:11.5px;color:var(--muted);text-align:right;font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.t td{text-align:right;padding:6px;border-bottom:1px solid var(--line);font-family:var(--f-num);white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left;font-family:var(--f-body);white-space:normal}
.scroll{overflow-x:auto}
.verdict{border-radius:12px;padding:10px 12px;font-size:13.5px}
.verdict.ok{background:var(--ok-soft)}.verdict.warn{background:var(--warn-soft)}.verdict.bad{background:var(--bad-soft)}
.planrow{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.planrow:last-child{border-bottom:0}
.planrow small{display:block;color:var(--muted);font-size:12px}
.day{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.log{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.log.undone{opacity:.55}.log.undone .lt b{text-decoration:line-through}
.lt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lt time{font:500 12px var(--f-num);color:var(--muted);white-space:nowrap}
.log ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.log li{display:flex;justify-content:space-between;gap:10px}
.log li span:last-child{font-family:var(--f-num);white-space:nowrap}
.undo{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;padding:2px 0;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font:700 15px var(--f-display);margin:0}
.card p{margin:0;color:var(--muted);font-size:13.5px}
textarea.inp{min-height:100px;font:12px/1.4 var(--f-num)}
.back{position:fixed;inset:0;z-index:20;background:rgba(10,20,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font:700 17px/1.25 var(--f-display);margin:0;overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);font-size:13px;margin:-8px 0 0}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center;margin:-6px 0 0}
.savebar{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:6;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.savebar .in{max-width:728px;margin:0 auto;display:flex;gap:8px;align-items:center}
.savebar .in span{flex:1;font-size:13px;color:var(--muted)}
.wbbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.wbbar>div{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.wbbar b{font-weight:600}
.wbbar small{color:var(--muted);font-size:12px}
.subjbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.subjbtn.set{border-style:solid}
.subjbtn span{min-width:0;display:flex;flex-direction:column;gap:2px}
.subjbtn small{color:var(--muted);font-size:12px}
.subjlist{display:flex;flex-direction:column;max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.subjlist button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px}
.subjlist button:last-child{border-bottom:0}
.subjlist button span{min-width:0;display:flex;flex-direction:column}
.subjlist small{color:var(--muted);font-size:12px}
.subjlist b.pc{font:700 15px var(--f-num);white-space:nowrap}
.chg{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.chg:last-child{border-bottom:0}
.chg b{font-weight:600}
.cloud{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cloud i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.cloud.ok i{background:var(--ok)}.cloud.wait i{background:var(--warn)}.cloud.err i{background:var(--bad)}
.keybox{font:600 15px var(--f-num);letter-spacing:.04em;background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.months .chip{white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.chart text{font:500 11px var(--f-body);fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + 86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
</style>
</head><body>
<header class="top"><div class="wrap" id="topbar"></div></header>
<main id="main" class="wrap"></main>
<button class="fab" id="fab" type="button"><span>+</span><b id="fabTxt">Добавить</b></button>
<div class="savebar" id="savebar" hidden><div class="in"><span>Есть несохранённые изменения</span><button type="button" class="btn main small" id="sb_save">Сохранить</button></div></div>
<nav class="tabs" aria-label="Разделы"><div class="in">
  <button type="button" data-v="products"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Изделия</button>
  <button type="button" data-v="materials"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M21 12h-3"/></svg>Материалы</button>
  <button type="button" data-v="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Журнал</button>

/* ================= данные и перенос ================= */
function valid(d){return d&&d.v===2&&Array.isArray(d.products)&&Array.isArray(d.plastics)&&Array.isArray(d.parts)}

function newProduct(o){return Object.assign({id:uid(),name:"",sku:"",qty:0,min:0,h:0,rec:{pl:[],pt:[]},g0:0,p0k:null,ex:[],wb:null,plan:0,subj:null,vol:0,autoLog:true},o||{})}

function migrate(sk,ce){
  const p={...DEF,...((ce&&ce.p)||{})};
  const D={v:2,p,products:[],plastics:[],parts:[],log:[]};
  const useSk=!!(sk&&Array.isArray(sk.products)&&!sk.sample);
  if(useSk){
    D.plastics=(sk.plastics||[]).map(x=>({...x,pk:x.pk>0?x.pk:p.ppk}));
    D.parts=(sk.parts||[]).map(x=>({...x,price:x.price>0?x.price:0}));
    D.products=sk.products.map(x=>newProduct({id:x.id,name:x.name,sku:x.sku||"",qty:x.qty||0,min:x.min||0,rec:{pl:(x.rec&&x.rec.pl)||[],pt:(x.rec&&x.rec.pt)||[]}}));
    D.log=Array.isArray(sk.log)?sk.log:[];
  }
  const items=ce&&Array.isArray(ce.items)?ce.items:CATALOG;
  for(const it of items){
    let pr=D.products.find(x=>normName(x.name)===normName(it.name));
    if(!pr){pr=newProduct({name:it.name});D.products.push(pr)}
    pr.sku=pr.sku||it.sku||"";pr.h=it.h||0;pr.plan=it.plan||0;
    pr.wb=it.wb?{...it.wb}:null;
    if(!pr.rec.pl.length){pr.g0=it.g||0;pr.p0k=it.ppk||null}
    pr.ex=[["Фурнитура",it.hw],["Упаковка внутр.",it.pin],["Коробка / пакет",it.pout],["Маркировка",it.mark]].filter(a=>a[1]>0).map(([n,v])=>({n,v}));
  }
  D.notice={sk:useSk,ce:!!ce};
  return D;
}

/* ================= формулы (как в таблице) ================= */
function cost(x){
  const P=S.p,h=x.h||0,lines=[];let plastic=0,grams=0,parts=0,extra=0;
  for(const r of x.rec.pl){const m=find("plastics",r.id);if(!m||!(r.q>0))continue;const pk=m.pk>0?m.pk:P.ppk,v=r.q*pk/1000;plastic+=v;grams+=r.q;lines.push({t:m.name,h:`${n1(r.q,2)} г × ${n1(pk,0)} ₽/кг`,v})}
  if(x.g0>0){const pk=x.p0k>0?x.p0k:P.ppk,v=x.g0*pk/1000;plastic+=v;grams+=x.g0;lines.push({t:"Пластик без привязки к складу",h:`${n1(x.g0,2)} г × ${n1(pk,0)} ₽/кг`,v})}
  for(const r of x.rec.pt){const m=find("parts",r.id);if(!m||!(r.q>0))continue;const pr=m.price||0,v=r.q*pr;parts+=v;lines.push({t:m.name,h:`${n1(r.q,2)} ${m.unit} × ${rub(pr,2)}`,v,miss:!(pr>0)})}
  for(const e of x.ex||[]){if(e.v>0){extra+=e.v;lines.push({t:e.n||"Прочее",h:"вручную",v:e.v})}}
  const elec=P.elec*h,labor=P.labor*h,wear=P.wear*h,defect=P.defect*(elec+plastic+wear),delivery=P.delivery;
  lines.push({t:"Электричество",h:`${n1(P.elec,2)} ₽/ч`,v:elec},{t:"Работа",h:`${n1(P.labor,2)} ₽/ч`,v:labor},{t:"Износ принтера",h:`${n1(P.wear,2)} ₽/ч`,v:wear},{t:"Брак",h:`${pct(P.defect,0)} от пластика, э/э, износа`,v:defect},{t:"Доставка до WB",h:"",v:delivery});
  return {total:plastic+parts+extra+elec+labor+wear+defect+delivery,plastic,grams,lines};
}
function wbCalc(c,h,b){
  const P=S.p,lb=b.lb>0?b.lb:P.lb,k=b.buy>0?b.buy:P.buy,acc=b.acc||0;
  const G=b.pb*(1-b.disc),L=lb/k,U=G*P.acq,comm=b.comm*G,ads=b.ads*G;
  const O=G-comm-L-acc-ads-U,tax=G*P.tax,Q=O-c-tax;
  return {G,L,U,comm,ads,acc,O,tax,Q,margin:G?Q/G:NaN,roi:c?Q/c:NaN,perH:h?Q/h:NaN,month:h?Q*24/h*P.load*30:NaN,buyerPrice:G*(1-(b.spp||0))};
}
function priceForMargin(c,b,m){
  const P=S.p,L=(b.lb>0?b.lb:P.lb)/(b.buy>0?b.buy:P.buy),acc=b.acc||0;
  const den=1-b.comm-b.ads-P.acq-P.tax-m;if(den<=0)return null;
  const G=(L+acc+c)/den;return {G,pb:b.disc<1?G/(1-b.disc):NaN};
}
function wholesale(c,G,comm,L,adsP){
  const P=S.p,opt=Math.round(G*(1-comm-adsP-P.acq)-L-G*P.partnerTax-G*P.partnerProfit);
  const mine=opt-c-opt*P.optTax;return {opt,mine,roi:c?mine/c:NaN};
}
function calc(x){const c=cost(x);const w=x.wb&&x.wb.pb>0&&x.h>0?wbCalc(c.total,x.h,x.wb):null;return {c,w}}
function ranks(skip){
  const arr=S.products.filter(x=>x.id!==skip).map(x=>({x,r:calc(x)})).filter(o=>o.r.w&&isFinite(o.r.w.perH)).sort((a,b)=>b.r.w.perH-a.r.w.perH);
  const m={};arr.forEach((o,i)=>m[o.x.id]=i+1);return {m,arr};
}
function hourTag(v){return !isFinite(v)?["mute","нет цены WB"]:v>=100?["ok","лидер"]:v>=70?["mid","норма"]:v>=0?["warn","слабо"]:["bad","убыток"]}
function stockValue(){
  let v=0;for(const m of S.plastics)v+=Math.max(0,m.qty)*(m.pk>0?m.pk:S.p.ppk)/1000;
  for(const m of S.parts)v+=Math.max(0,m.qty)*(m.price||0);
  for(const p of S.products)v+=Math.max(0,p.qty)*cost(p).total;return v;
}

/* ================= журнал ================= */
function commit(text,changes,note){
  changes=changes.filter(ch=>ch.d&&find(ch.c,ch.id));
  if(!changes.length)return false;
  for(const ch of changes){const it=find(ch.c,ch.id);it.qty=r1(it.qty+ch.d);ch.n=it.name;ch.u=unitOf(ch.c,it)}
  S.log.unshift({id:uid(),t:Date.now(),text,changes,note:note||""});
  if(S.log.length>3000)S.log.length=3000;
  save();return true;
}
function undo(id){
  const e=S.log.find(x=>x.id===id);if(!e||e.undone)return;
  const back=[];for(const ch of e.changes){const it=find(ch.c,ch.id);if(it){it.qty=r1(it.qty-ch.d);back.push({...ch,d:-ch.d})}}
  e.undone=true;S.log.unshift({id:uid(),t:Date.now(),text:"Отмена: "+e.text,changes:back,isUndo:true});
  save();render();toast("Операция отменена, остатки вернулись");
}

/* ================= изделия: список ================= */
function productsHtml(){
  const q=($("#q")&&$("#q").value||"").trim().toLowerCase();
  const R=ranks();
  let all=S.products.map(x=>({x,r:calc(x)}));
  const on=all.filter(o=>o.r.w),avg=f=>on.length?on.reduce((a,o)=>a+f(o),0)/on.length:NaN;
  const kp=`<div class="kpis"><div class="kpi"><span>Деньги на складе</span><b>${rub(stockValue())}</b><small>по себестоимости</small></div><div class="kpi"><span>Среднее ₽/час</span><b>${n1(avg(o=>o.r.w.perH),0)}</b><small>маржа ${pct(avg(o=>o.r.w.margin))}</small></div><div class="kpi"><span>Пополнить</span><b>${lowCount("products")}</b><small>изделий ниже минимума</small></div></div>`;
  if(q)all=all.filter(o=>(o.x.name+" "+o.x.sku).toLowerCase().includes(q));
  if(onlyLow)all=all.filter(o=>needs(o.x));
  const rank={bad:0,warn:1,ok:2,none:3};
  const keys={attention:(a,b)=>(rank[state(a.x)]-rank[state(b.x)]),hour:(a,b)=>(b.r.w?b.r.w.perH:-1e9)-(a.r.w?a.r.w.perH:-1e9),margin:(a,b)=>(b.r.w?b.r.w.margin:-1e9)-(a.r.w?a.r.w.margin:-1e9),name:()=>0};
  all.sort((a,b)=>keys[prodSort](a,b)||a.x.name.localeCompare(b.x.name,"ru"));
  const chip=(k,t)=>`<button type="button" class="chip ${prodSort===k&&!(k==="attention"&&onlyLow)?"on":""}" data-sort="${k}">${t}</button>`;
  const head=`<div class="bar"><div class="chips">${chip("attention","Остаток")}${chip("hour","₽/час")}${chip("margin","Маржа")}${chip("name","А–Я")}<button type="button" class="chip ${onlyLow?"on":""}" data-act="onlyLow">Пополнить</button></div></div>`;
  const wbb=wbBarHtml();
  if(!S.products.length)return kp+wbb+`<div class="empty"><b>Изделий пока нет</b>Нажмите «+», чтобы добавить первое.</div>`;
  if(!all.length)return kp+wbb+head+`<div class="empty"><b>Ничего не найдено</b>${onlyLow?"Всё в норме.":"Попробуйте другое слово."}</div>`;
  return kp+wbb+head+`<div class="list">${all.map(({x,r})=>{
    const st=state(x),w=r.w,pl=R.m[x.id],[tc]=hourTag(w?w.perH:NaN);
    const eco=w?`${n1(w.perH,0)} ₽/ч${pl?" · #"+pl:""} · маржа ${pct(w.margin)}`:x.h>0?"нет цены WB":"не указано время печати";
    return `<button type="button" class="row" data-prod="${x.id}"><span class="lead"><span class="stripe ${st}"></span></span><span class="info"><b>${esc(x.name)}</b><small>себест. ${rub(r.c.total)} · <span style="color:var(--${tc==="ok"?"ok":tc==="warn"?"warn":tc==="bad"?"bad":tc==="mid"?"accent":"muted"})">${eco}</span></small></span><span class="qty"><b>${n1(x.qty)}<small>шт</small></b><span class="tag ${st}">${STATE_TXT[st]}</span></span></button>`}).join("")}</div>
  <p class="hint">Цветная полоска — остаток на складе. ₽/ч — прибыль за час работы принтера и место среди изделий: ниже 70 ₽/ч стоит поднять цену или ускорить печать.</p>`;
}

function wbBarHtml(){
  if(!S.wbcfg.url)return "";
  const last=S.wbcfg.last?new Date(S.wbcfg.last):null,days=last?Math.floor((Date.now()-last)/86400000):null;
  const noSubj=S.products.filter(p=>p.wb&&!p.subj).length;
  return `<div class="wbbar"><div><b>Тарифы WB</b><small>${last?(days===0?"проверены сегодня":days===1?"проверены вчера":`проверены ${days} дн. назад`):"ещё не проверялись"}${noSubj?` · без предмета: ${noSubj}`:""}</small></div><button type="button" class="btn small ${days===null||days>=7?"main":""}" data-act="wbUpdate">Обновить</button></div>`;
}

/* ================= материалы ================= */
function materialsHtml(){
  const c=matTab,q=($("#q")&&$("#q").value||"").trim().toLowerCase();
  let items=S[c].filter(x=>!q||(x.name+" "+(x.brand||"")).toLowerCase().includes(q));
  const low=S[c].filter(needs).length;
  if(onlyLow)items=items.filter(needs);
  items.sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  let val=0,sum="";
  if(c==="plastics"){for(const m of S.plastics)val+=Math.max(0,m.qty)*(m.pk>0?m.pk:S.p.ppk)/1000;sum=`${n1(S.plastics.reduce((a,x)=>a+Math.max(0,x.qty),0)/1000)} кг на ${rub(val)}`}
  else{for(const m of S.parts)val+=Math.max(0,m.qty)*(m.price||0);sum=`${S.parts.length} поз. на ${rub(val)}`}
  const noPrice=c==="parts"?S.parts.filter(x=>!(x.price>0)).length:0;
  const head=`<div class="seg"><button type="button" data-mat="plastics" class="${c==="plastics"?"on":""}">Пластик</button><button type="button" data-mat="parts" class="${c==="parts"?"on":""}">Детали и упаковка</button></div>
   <div class="bar"><span class="summary">${sum}</span><div class="chips"><button type="button" class="chip ${!onlyLow?"on":""}" data-act="allMat">Все</button><button type="button" class="chip ${onlyLow?"on":""}" data-act="onlyLow">Пополнить${low?" · "+low:""}</button></div></div>
   ${noPrice?`<div class="banner"><p>У ${noPrice} поз. не указана цена — в себестоимости они считаются по 0 ₽. Откройте деталь → «Изменить» и введите цену за штуку, или укажите сумму при следующем приходе.</p></div>`:""}`;
  if(!S[c].length)return head+`<div class="empty"><b>Пока пусто</b>Нажмите «+», чтобы добавить ${c==="plastics"?"первую катушку":"первую деталь или упаковку"}.</div>`;
  if(!items.length)return head+`<div class="empty"><b>Ничего не найдено</b></div>`;
  return head+`<div class="list">${items.map(it=>{
    const st=state(it),u=unitOf(c,it);let sub,lead=`<span class="stripe ${st}"></span>`;
    if(c==="plastics"){sub=`${n1(it.pk>0?it.pk:S.p.ppk,0)} ₽/кг · ≈ ${n1(Math.max(0,it.qty)/(it.spool||1000))} кат. · мин. ${n1(it.min)} г`;lead+=`<span class="sw" style="border-color:${esc(it.hex||"#888")}"></span>`}
    else sub=`${it.price>0?rub(it.price,2)+" за "+esc(u):"цена не указана"} · мин. ${n1(it.min)}`;
    return `<button type="button" class="row" data-c="${c}" data-id="${it.id}"><span class="lead">${lead}</span><span class="info"><b>${esc(it.name)}</b><small>${sub}</small></span><span class="qty"><b>${n1(it.qty)}<small>${esc(u)}</small></b><span class="tag ${st}">${STATE_TXT[st]}</span></span></button>`}).join("")}</div>`;
}

  const value=c==="plastics"?Math.max(0,it.qty)*(it.pk>0?it.pk:S.p.ppk)/1000:Math.max(0,it.qty)*(it.price||0);

    <div class="bar"><div class="big">${n1(it.qty)}<small>${esc(u)}</small></div><span class="tag ${st}">${STATE_TXT[st]} · мин. ${n1(it.min)}</span></div>
    <div class="actions"><button type="button" class="btn main" data-op="in">Пришло</button><button type="button" class="btn" data-op="out">Израсходовал</button><button type="button" class="btn ghost" data-op="set">Пересчёт</button></div>
    <div class="box"><div class="ln"><span>Цена</span><span>${price}</span></div><div class="ln"><span>На складе на сумму</span><span>${rub(value)}</span></div>
    ${used.length?`<div class="ln"><span>Используется в</span><span></span></div>${used.map(p=>`<div class="ln"><small>${esc(p.name)}</small><small>${n1((c==="plastics"?p.rec.pl:p.rec.pt).find(r=>r.id===id).q,2)} ${esc(u)}/шт</small></div>`).join("")}`:`<p class="hint">Пока не входит в состав ни одного изделия.</p>`}</div>
    ${hist.length?`<div class="box"><h3>Последние операции</h3>${hist.map(e=>{const ch=e.changes.find(x=>x.id===id);return `<div class="ln"><span>${esc(new Date(e.t).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}))} · ${esc(e.text.split(":")[0])}</span><span class="${ch.d>0?"plus":"minus"}">${ch.d>0?"+":"−"}${n1(Math.abs(ch.d))}</span></div>`}).join("")}</div>`:""}
    <div class="row2" id="tail"><button type="button" class="btn ghost" data-edit>Изменить</button><button type="button" class="btn danger" data-del>Удалить</button></div>`,

      t.querySelector("[data-no]").onclick=()=>openMat(c,id);
      t.querySelector("[data-yes]").onclick=()=>{S[c]=S[c].filter(x=>x.id!==id);S.products.forEach(p=>{p.rec.pl=p.rec.pl.filter(r=>r.id!==id);p.rec.pt=p.rec.pt.filter(r=>r.id!==id)});save();closeSheet();render();toast("Удалено")};
    };

function openAction(c,id,op,after){
  const it=find(c,id),u=unitOf(c,it);
  const T={print:["Напечатал","Сколько штук сняли с принтера (без брака)?","Записать печать"],ship:["Отгрузил","Сколько штук ушло покупателям или на склад WB?","Списать"],
    in:["Пришло",c==="plastics"?"Сколько граммов пришло? Катушка — "+n1(it.spool||1000)+" г.":"Сколько пришло?","Добавить"],
    out:["Израсходовал",c==="plastics"?"Сколько граммов ушло мимо изделий: тест, брак, продувка?":"Сколько ушло?","Списать"],
    set:["Пересчёт","Сколько на самом деле лежит сейчас? Разница запишется в журнал.","Сохранить остаток"]}[op];
  let chips=[];
  if(op==="set")chips=[];
  else if(c==="products")chips=[1,5,10,20];
  else if(c==="plastics")chips=op==="in"?[[it.spool||1000,"+1 кат."],[(it.spool||1000)*2,"+2 кат."],[(it.spool||1000)*4,"+4 кат."]]:[10,50,100];
  else chips=[10,50,100];
  chips=chips.map(x=>Array.isArray(x)?x:[x,"+"+x]);
  const paidField=op==="in"&&c!=="products"?`<div class="field"><span>Заплатил за эту поставку, ₽ (необязательно)</span><input id="a_paid" class="inp" type="text" inputmode="decimal" placeholder="Например: 1450"><small>Средняя цена ${c==="plastics"?"за кг":"за "+esc(u)} пересчитается, и себестоимость изделий обновится</small></div>`:"";
  openSheet(`<h2>${T[0]}: ${esc(it.name)}</h2><p class="sub">${T[1]}</p>
    <div class="field"><span>${op==="set"?"Фактический остаток":"Количество"}, ${esc(u)}</span><input id="a_n" class="inp numbig" type="text" inputmode="decimal" value="${op==="set"?esc(String(it.qty).replace(".",",")):""}" autofocus></div>
    ${chips.length?`<div class="chips">${chips.map(([v,l])=>`<button type="button" class="chip" data-add="${v}">${l}</button>`).join("")}</div>`:""}
    ${paidField}
    <div id="a_prev"></div>
    <div class="field"><span>Комментарий (необязательно)</span><input id="a_note" class="inp" type="text" placeholder="${op==="ship"?"Например: поставка WB №…":op==="in"?"Например: Ozon, заказ от 20.10":"Например: брак, стол не прилип"}"></div>
    <div class="row2"><button type="button" class="btn main" id="a_ok">${T[2]}</button><button type="button" class="btn" id="a_cancel">Назад</button></div>`,
  s=>{
    const inp=s.querySelector("#a_n"),prev=s.querySelector("#a_prev"),paid=s.querySelector("#a_paid");
    const build=()=>{
      const n=num(inp.value);if(!(n>=0)||(op!=="set"&&!(n>0)))return null;
      if(op==="set")return [{c,id,d:r1(n-it.qty)}];
      if(op==="print"){const ch=[{c,id,d:n}];it.rec.pl.forEach(r=>ch.push({c:"plastics",id:r.id,d:-r1(r.q*n)}));it.rec.pt.forEach(r=>ch.push({c:"parts",id:r.id,d:-r1(r.q*n)}));return ch}
      return [{c,id,d:(op==="ship"||op==="out")?-n:n}];
    };
    const newPrice=()=>{
      if(!paid)return null;const n=num(inp.value),pd=num(paid.value);if(!(n>0)||!(pd>0))return null;
      const per=c==="plastics"?pd/n*1000:pd/n,old=c==="plastics"?(it.pk>0?it.pk:S.p.ppk):(it.price||0),oq=Math.max(0,it.qty);
      const avg=old>0&&oq>0?(oq*old+n*per)/(oq+n):per;return {per,avg};
    };
    const upd=()=>{
      const ch=build();if(!ch){prev.innerHTML="";return}
      const rows=ch.filter(x=>find(x.c,x.id)).map(x=>{const m=find(x.c,x.id),left=r1(m.qty+x.d);return `<div class="ln"><span>${esc(m.name)}</span><span>${x.d>0?"+":"−"}${n1(Math.abs(x.d))} → <span class="${left<0?"neg":""}">${n1(left)} ${esc(unitOf(x.c,m))}</span></span></div>`});
      const short=ch.some(x=>{const m=find(x.c,x.id);return m&&m.qty+x.d<0});
      const np=newPrice();const pu=c==="plastics"?"₽/кг":"₽ за "+u;
      prev.innerHTML=`<div class="box"><h3>Что изменится</h3>${rows.join("")}${np?`<div class="ln"><span>Цена этой поставки</span><span>${n1(np.per,2)} ${esc(pu)}</span></div><div class="ln"><span><b>Новая средняя цена</b></span><span><b>${n1(np.avg,2)} ${esc(pu)}</b></span></div>`:""}${short?`<p class="hint neg">Не хватает остатков. Сохранить можно, но лучше сначала проверить склад.</p>`:""}${op==="print"&&!(it.rec.pl.length||it.rec.pt.length)?`<p class="hint">Состав не указан, поэтому материалы не спишутся.</p>`:""}</div>`;
    };
    inp.addEventListener("input",upd);paid&&paid.addEventListener("input",upd);
    s.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{inp.value=String(r1((num(inp.value)||0)+(+b.dataset.add))).replace(".",",");upd()});
    s.querySelector("#a_cancel").onclick=()=>c==="products"?closeSheet():openMat(c,id);
    s.querySelector("#a_ok").onclick=()=>{
      const ch=build();if(!ch){inp.focus();toast("Введите количество больше нуля");return}
      const n=num(inp.value),np=newPrice();
      if(np){if(c==="plastics")it.pk=Math.round(np.avg*100)/100;else it.price=Math.round(np.avg*100)/100}
      const text={print:`Напечатано: ${it.name} × ${n1(n)}`,ship:`Отгружено: ${it.name} × ${n1(n)}`,in:`Приход: ${it.name}`,out:`Расход: ${it.name}`,set:`Пересчёт: ${it.name}`}[op];
      const note=[s.querySelector("#a_note").value.trim(),np?`оплачено ${rub(num(paid.value))}`:""].filter(Boolean).join(" · ");
      const ok=commit(text,ch,note);if(!ok&&np)save();
      closeSheet();
      if(after)after();else render();
      toast(ok?"Записано":"Остаток не изменился");
    };
    upd();
  });
}

  if(isNew)body+=fieldH("Сейчас на складе, "+(c==="plastics"?"г":"ед."),`<input id="e_start" class="inp" type="text" inputmode="decimal" placeholder="0">`,"Запишется в журнал как начальный остаток");
  openSheet(`<h2>${isNew?(c==="plastics"?"Новый пластик":"Новая деталь или упаковка"):"Изменить"}</h2>${body}
    <div class="row2"><button type="button" class="btn main" id="e_ok">${isNew?"Добавить":"Сохранить"}</button><button type="button" class="btn" id="e_cancel">Отмена</button></div>`,s=>{
    s.querySelector("#e_cancel").onclick=()=>isNew?closeSheet():openMat(c,id);
    s.querySelector("#e_ok").onclick=()=>{
      const v=k=>{const e=s.querySelector("#e_"+k);return e?e.value.trim():""};
      const mn=num(v("min"));it.min=mn>=0?mn:0;
      if(c==="plastics"){it.type=v("type")||"PLA";it.color=v("color");it.hex=v("hex");it.brand=v("brand");const sp=num(v("spool"));it.spool=sp>0?sp:1000;const pk=num(v("pk"));it.pk=pk>0?pk:S.p.ppk;it.name=(it.type+" "+it.color).trim()}
      else{it.name=v("name");it.unit=v("unit")||"шт";const pr=num(v("price"));it.price=pr>0?pr:0}
      if(!it.name||(c==="plastics"&&!it.color)){toast(c==="plastics"?"Укажите цвет":"Укажите название");return}
      if(isNew){it.id=uid();it.qty=0;S[c].push(it);const st=num(v("start"));if(st>0)commit("Начальный остаток: "+it.name,[{c,id:it.id,d:st}]);else save();closeSheet();render();toast("Добавлено")}
      else{Object.assign(src,it);save();render();openMat(c,id);toast("Сохранено")}
    };
  });
}

function readForm(){

const WBC="master3d_wbcache";
const MODEL_TXT={fbs:"FBS",dbs:"DBS",edbs:"DBS экспресс",fbw:"FBW"};
const MODEL_COL={fbs:3,dbs:4,edbs:5,fbw:6};
let wbCache=null;
function wbLoadCache(){if(wbCache)return wbCache;try{wbCache=JSON.parse(localStorage.getItem(WBC)||"null")}catch(e){wbCache=null}return wbCache}
function wbSaveCache(c){wbCache=c;try{localStorage.setItem(WBC,JSON.stringify(c))}catch(e){}}
function wbSubj(id){const c=wbLoadCache();if(!c)return null;const r=c.subjects.find(x=>x[0]===id);return r?{id:r[0],name:r[1],parent:r[2],row:r}:null}
function wbRate(row,model){const v=row[MODEL_COL[model||S.wbcfg.model]];return v===null||v===""||v===undefined?null:+v}
function wbWarehouse(c,name){c=c||wbLoadCache();if(!c||!c.warehouses||!c.warehouses.length)return null;
  return c.warehouses.find(w=>w.name===name)||c.warehouses.find(w=>/маркетплейс/i.test(w.name))||c.warehouses[0]}
function wbT(w,vol,model){if(!w)return NaN;const fb=(model||S.wbcfg.model)==="fbw";const b1=fb?w.fbw1:w.fbs1,bl=fb?w.fbwL:w.fbsL;if(!(b1>0))return NaN;return b1+(bl>0?bl:0)*Math.max(0,(vol>0?vol:1)-1)}
async function wbFetch(){
  const url=(S.wbcfg.url||"").trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))throw new Error("Вставьте адрес веб-приложения из Google (начинается с https://script.google.com/…/exec)");
  const ids=[...new Set(S.products.filter(p=>p.subj).map(p=>p.subj.id))].join(",");
  const q=`?model=${encodeURIComponent(S.wbcfg.model)}&wh=${encodeURIComponent(S.wbcfg.wh||"")}${ids?"&track="+ids:""}`;
  let res;
  try{res=await fetch(url+q,{method:"GET",redirect:"follow"})}catch(e){throw new Error("Нет связи со скриптом. Проверьте интернет и что веб-приложение открыто для «Все».")}
  let d;try{d=await res.json()}catch(e){throw new Error("Скрипт ответил не данными. Проверьте, что в развертывании выбрано «Веб-приложение» и доступ «Все».")}
  if(!d||!d.ok)throw new Error(d&&d.error?d.error:"Скрипт вернул ошибку");
  const c={updated:d.updated||"",fetched:Date.now(),subjects:d.subjects||[],warehouses:d.warehouses||[]};
  wbSaveCache(c);
  if(!S.wbcfg.wh){const w=wbWarehouse(c,"");if(w)S.wbcfg.wh=w.name}
  return c;
}
function wbPropose(c){
  const out=[],cur=wbWarehouse(c,S.wbcfg.wh),snap=S.wbSnap;
  const logOk=!!(snap&&cur&&snap.name===cur.name&&snap.model===S.wbcfg.model);
  for(const p of S.products){
    if(!p.wb)continue;const ch={p,before:calc(p)};
    if(p.subj){const r=c.subjects.find(x=>x[0]===p.subj.id);if(r){const v=wbRate(r);if(v!==null&&Math.abs(v/100-p.wb.comm)>1e-9)ch.comm=[p.wb.comm,v/100]}else ch.lost=true}
    if(logOk&&p.autoLog!==false){const o=wbT(snap,p.vol),n=wbT(cur,p.vol);if(o>0&&n>0&&Math.abs(n-o)>1e-9){const lb=p.wb.lb>0?p.wb.lb:S.p.lb;ch.lb=[lb,Math.round(lb*n/o*100)/100]}}
    if(ch.comm||ch.lb){const t=JSON.parse(JSON.stringify(p));if(ch.comm)t.wb.comm=ch.comm[1];if(ch.lb)t.wb.lb=ch.lb[1];ch.after=calc(t);out.push(ch)}
  }
  return {list:out,cur,logOk,first:!snap||!cur||snap.name!==cur.name||snap.model!==S.wbcfg.model};
}
function wbApply(pr){
  for(const ch of pr.list){if(ch.comm)ch.p.wb.comm=ch.comm[1];if(ch.lb)ch.p.wb.lb=ch.lb[1]}
  if(pr.cur)S.wbSnap={name:pr.cur.name,model:S.wbcfg.model,fbs1:pr.cur.fbs1,fbsL:pr.cur.fbsL,fbw1:pr.cur.fbw1,fbwL:pr.cur.fbwL,date:Date.now()};
  S.wbcfg.last=new Date().toISOString();
  if(pr.list.length)S.log.unshift({id:uid(),t:Date.now(),text:`Тарифы WB: обновлено изделий — ${pr.list.length}`,changes:[],isUndo:true,
    note:pr.list.map(ch=>ch.p.name+": "+[ch.comm?`комиссия ${pct(ch.comm[0])} → ${pct(ch.comm[1])}`:"",ch.lb?`логистика ${n1(ch.lb[0],2)} → ${n1(ch.lb[1],2)} ₽`:""].filter(Boolean).join(", ")).join("; ")});
  save();
}

    ${b&&a?`<div class="ln"><span>Прибыль / шт</span><span>${rub(b.Q)} → <b class="${a.Q<b.Q?"minus":"plus"}">${rub(a.Q)}</b></span></div>`:""}</div>`}).join("");
  openSheet(`<h2>Изменились тарифы WB</h2>${head}<div>${rows}</div>${foot}<div class="row2"><button type="button" class="btn main" id="w_ok">Применить</button><button type="button" class="btn" id="w_no">Не сейчас</button></div>`,s=>{

function cloudDot(){

function gUrl(){const u=(S.wbcfg.url||"").trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u))throw new Error("Сначала вставьте адрес веб-приложения Google: «Ещё» → «Тарифы WB».");return u}
async function gGet(params){
  const u=gUrl()+"?"+Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  let r;try{r=await fetch(u,{method:"GET",redirect:"follow"})}catch(e){throw new Error("Нет связи с Google. Проверьте интернет.")}
  try{return await r.json()}catch(e){throw new Error("Google ответил не данными. Проверьте развертывание скрипта.")}
}
async function gPost(body){

function errText(e){return e==="wrong_key"?"Ключ не совпадает с ключом в таблице. Посмотрите его в таблице: меню «WB тарифы» → «Показать ключ синхронизации».":e==="no_key"?"В таблице синхронизация ещё не включена.":e}
function syncTables(){

  const stock=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name,"ru")).map(x=>{const r=calc(x),w=r.w;return [x.name,x.sku||"",f(x.qty),f(x.min),STATE_TXT[state(x)],f(r.c.total),w?f(x.wb.pb):"",w?f(w.G):"",w?f(w.Q):"",w?f(w.margin*100):"",w?f(w.perH):"",f(Math.max(0,x.qty)*r.c.total)]});
  const mats=[...S.plastics.map(m=>{const pk=m.pk>0?m.pk:S.p.ppk;return ["Пластик",m.name,f(m.qty),"г",f(m.min),STATE_TXT[state(m)],f(pk)+" ₽/кг",f(Math.max(0,m.qty)*pk/1000)]}),
    ...S.parts.map(m=>["Детали",m.name,f(m.qty),m.unit,f(m.min),STATE_TXT[state(m)],f(m.price||0),f(Math.max(0,m.qty)*(m.price||0))])];
  const log=S.log.slice(0,1000).map(e=>[new Date(e.t).toLocaleString("ru-RU"),e.text+(e.undone?" (отменено)":""),e.changes.map(c=>`${c.n}: ${c.d>0?"+":""}${n1(c.d)} ${c.u}`).join("; "),e.note||""]);
  return {stock:{head:["Изделие","Артикул WB","Остаток, шт","Минимум","Статус","Себестоимость, ₽","Цена до скидки, ₽","Цена после скидки, ₽","Прибыль/шт, ₽","Маржа, %","₽ за час печати","Остаток по себестоимости, ₽"],rows:stock},

    log:{head:["Дата","Операция","Изменения","Комментарий"],rows:log}};

async function syncPush(o={}){
  if(!SY.on&&!o.first)return false;
  if(pushing){pushAgain=true;return false}
  pushing=true;let ok=false;
  try{
    const rev=SY.localRev||Date.now();
    const d=await gPost({action:"push",key:SY.key,device:SY.device,rev,base:SY.base,state:JSON.stringify(S),tables:syncTables(),first:!!o.first,force:!!o.force});
    if(d&&d.ok){SY.base=d.rev;SY.pushedRev=rev;SY.localRev=Math.max(SY.localRev,rev);SY.lastPush=Date.now();SY.err="";syncConflict=null;ok=true}
    else if(d&&d.error==="conflict"){syncConflict=d;SY.err="";if(view!=="prod")renderMain()}
    else SY.err=errText(d&&d.error||"Ошибка");
  }catch(e){SY.err=e.message}
  finally{pushing=false;saveSync();cloudDot();if(view==="more")renderMain();if(pushAgain){pushAgain=false;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncPush(),3000)}}
  return ok;
}
async function syncCheck(){
  if(!SY.on)return;
  try{
    const d=await gGet({action:"meta",key:SY.key});
    if(!d.ok){SY.err=errText(d.error);saveSync();cloudDot();return}
    SY.err="";
    if(d.rev>SY.base&&d.device!==SY.device){syncConflict=d;if(view!=="prod")renderMain()}
    else if(SY.localRev>SY.pushedRev)syncPush();
  }catch(e){SY.err=e.message}
  saveSync();cloudDot();
}
async function syncPull(key){
  const d=await gGet({action:"pull",key:key||SY.key});

  let st;try{st=JSON.parse(d.state)}catch(e){throw new Error("Данные в таблице повреждены")}
  if(!valid(st))throw new Error("В таблице нет данных мастерской");
  S=normalize(st);lastJson="";save();
  SY.on=true;if(key)SY.key=key;SY.base=d.rev;SY.localRev=SY.pushedRev=d.rev;SY.lastPush=Date.now();SY.err="";syncConflict=null;saveSync();
}
function randKey(){const a=new Uint8Array(15);(crypto||window.crypto).getRandomValues(a);return [...a].map(b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("").replace(/(.{5})(?!$)/g,"$1-")}
async function syncEnable(btn){

const SAKEY="master3d_sales";
let salesTab="sales",salesMonth=null,salesCache=null;
const MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const mLabel=(m,short)=>{const [y,mm]=m.split("-");const n=MONTHS[+mm-1];return short?n.slice(0,3):n[0].toUpperCase()+n.slice(1)+" "+y};
function salesLoad(){if(salesCache)return salesCache;try{salesCache=JSON.parse(localStorage.getItem(SAKEY)||"null")}catch(e){}return salesCache}
async function salesFetch(btn){
  if(btn){btn.disabled=true;btn.textContent="Загружаю…"}
  try{const d=await gGet({action:"sales",key:SY.key,months:13});if(!d.ok)throw new Error(errText(d.error));
    salesCache={at:d.at,from:d.from,months:d.months,rows:d.rows,fetched:Date.now()};try{localStorage.setItem(SAKEY,JSON.stringify(salesCache))}catch(e){}
    if(!salesMonth||!d.months.includes(salesMonth))salesMonth=d.months[0];toast("Продажи обновлены")}
  catch(e){toast(e.message)}
  if(view==="plan")renderMain();
}
function matchProd(row){const nm=String(row.nm),art=String(row.art||"").trim().toLowerCase();
  return S.products.find(p=>{const k=String(p.sku||"").trim();return k&&(k===nm||k.toLowerCase()===art)})||null}
function salesAgg(rows){
  const P=S.p,by={};let tot={n:0,r:0,rev:0,pay:0,profit:0,unmatched:0};
  for(const o of rows){
    const p=matchProd(o),key=p?p.id:"nm"+o.nm;
    const a=by[key]||(by[key]={p,o,n:0,r:0,rev:0,pay:0,profit:p?0:null});
    a.n+=o.n;a.r+=o.r;a.rev+=o.rev;a.pay+=o.pay;
    if(p){const net=o.n-o.r,w=p.wb||{},L=(w.lb>0?w.lb:P.lb)/(w.buy>0?w.buy:P.buy),ads=w.ads!=null?w.ads:P.ads;
      a.profit+=o.pay-net*L-ads*o.rev-P.tax*o.rev-net*cost(p).total}
  }
  const list=Object.values(by).sort((a,b)=>b.rev-a.rev);
  for(const a of list){tot.n+=a.n;tot.r+=a.r;tot.rev+=a.rev;tot.pay+=a.pay;if(a.p)tot.profit+=a.profit;else tot.unmatched+=a.n-a.r}
  return {list,tot};
}
function salesChart(c){
  const months=c.months.slice(0,12).reverse();
  const data=months.map(m=>{const a=salesAgg(c.rows.filter(r=>r.m===m)).tot;return {m,rev:a.rev,pr:a.profit}});
  if(!data.some(d=>d.rev))return "";
  const W=340,H=150,top=12,bot=22,max=Math.max(...data.map(d=>Math.max(d.rev,d.pr)),1),min=Math.min(0,...data.map(d=>d.pr));
  const y=v=>top+(H-top-bot)*(max-v)/(max-min),bw=(W-8)/data.length;
  const bars=data.map((d,i)=>{const x=4+i*bw,w=bw*0.36;const y0=y(0);
    const rv=`<rect x="${x+bw*0.12}" y="${y(d.rev)}" width="${w}" height="${Math.max(0,y0-y(d.rev))}" rx="2" fill="var(--c2)"><title>${mLabel(d.m)}: выручка ${rub(d.rev)}</title></rect>`;
    const py=d.pr>=0?y(d.pr):y0,ph=Math.abs(y(d.pr)-y0);
    const pr=`<rect x="${x+bw*0.12+w+2}" y="${py}" width="${w}" height="${ph}" rx="2" fill="${d.pr>=0?"var(--c1)":"var(--bad)"}"><title>${mLabel(d.m)}: прибыль ≈ ${rub(d.pr)}</title></rect>`;
    return rv+pr+`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle"${d.m===salesMonth?' style="fill:var(--fg);font-weight:700"':""}>${mLabel(d.m,true)}</text>`}).join("");
  return `<section class="sec"><h2>По месяцам <small>последние ${data.length}</small></h2><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Выручка и прибыль по месяцам"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${bars}</svg>
   <div class="legend"><span><i style="background:var(--c2)"></i>Выручка</span><span><i style="background:var(--c1)"></i>Прибыль ≈</span></div></section>`;
}

function salesHtml(){
  if(!SY.on)return `<div class="empty"><b>Продажи приходят из WB через вашу Google Таблицу</b>Включите синхронизацию: «Ещё» → «Синхронизация с Google». Ключ защищает ваши продажи от посторонних.<div class="row2" style="margin-top:12px"><button type="button" class="btn main" data-act="goMore">Открыть настройки</button></div></div>`;

  const withData=c.months.filter(m=>c.rows.some(r=>r.m===m));

  const rows=c.rows.filter(r=>r.m===salesMonth),A=salesAgg(rows),t=A.tot;
  if(!rows.length)return upd+chips+`<div class="empty"><b>Продаж за ${mLabel(salesMonth).toLowerCase()} нет</b>WB отдаёт данные с задержкой до 30 минут.</div>`+salesChart(c);
  const kp=`<div class="kpis"><div class="kpi"><span>Продано</span><b>${n1(t.n-t.r,0)} шт</b><small>${t.r?`возвратов ${n1(t.r,0)}`:"без возвратов"}</small></div><div class="kpi"><span>Выручка</span><b>${rub(t.rev)}</b><small>к перечислению ${rub(t.pay)}</small></div><div class="kpi"><span>Прибыль ≈</span><b class="${t.profit<0?"neg":""}">${rub(t.profit)}</b><small>${t.unmatched?`без ${n1(t.unmatched,0)} шт не привязанных`:"оценка по вашим ставкам"}</small></div></div>`;
  const list=`<section class="sec"><h2>По изделиям <small>${mLabel(salesMonth)}</small></h2><div class="scroll"><table class="t"><thead><tr><th>Изделие</th><th>Шт</th><th>Выручка</th><th>Прибыль ≈</th></tr></thead><tbody>${A.list.map(a=>`<tr><td>${a.p?esc(a.p.name):`<span class="neg">Арт. ${esc(a.o.nm)}</span> <small class="hint">${esc(a.o.subj||"")} · ${esc(a.o.art||"")}</small><br><button type="button" class="undo" data-bind="${esc(a.o.nm)}">Привязать к изделию</button>`}</td><td>${n1(a.n-a.r,0)}${a.r?`<br><small class="hint">−${a.r} возвр.</small>`:""}</td><td>${rub(a.rev)}</td><td class="${a.profit<0?"neg":""}">${a.p?rub(a.profit):"—"}</td></tr>`).join("")}</tbody></table></div>
   <p class="hint">Выручка — по вашей цене после скидки, до СПП. Прибыль ≈ = к перечислению от WB − логистика − реклама − налог − себестоимость, по ставкам из карточек изделий. WB уточняет суммы в течение суток, точные цифры будут в еженедельном отчёте о реализации.</p></section>`;
  return upd+chips+kp+salesChart(c)+list;
}

function planHtml(){
  const items=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  if(!items.length)return `<div class="empty">Сначала добавьте изделия.</div>`;
  return `<div id="planRes"></div><section class="sec" id="needSec"></section>
  <div class="list">${items.map(x=>{const r=calc(x);return `<label class="planrow"><span><b style="font-weight:600">${esc(x.name)}</b><small>на складе ${n1(x.qty)} шт · ${hm(x.h)} · ${r.w?rub(r.w.Q)+"/шт":"нет цены WB"}</small></span><input class="inp" type="text" inputmode="numeric" data-plan="${x.id}" value="${x.plan||""}" placeholder="0 шт" aria-label="Продаж в месяц"></label>`}).join("")}</div>
  <p class="hint">Введите план продаж на месяц. Печатать нужно план минус то, что уже лежит на складе. Принтер при загрузке ${pct(S.p.load,0)} работает ${n1(24*30*S.p.load,0)} ч в месяц.</p>`;
}
function planUpdate(){
  let hours=0,profit=0,pcs=0,toPrint=0,g0=0;const need={plastics:{},parts:{}};
  for(const x of S.products){const q=x.plan||0;if(!q)continue;const r=calc(x);pcs+=q;if(r.w)profit+=q*r.w.Q;
    const pr=Math.max(0,q-Math.max(0,x.qty));toPrint+=pr;hours+=pr*(x.h||0);g0+=pr*(x.g0||0);
    for(const r2 of x.rec.pl)need.plastics[r2.id]=(need.plastics[r2.id]||0)+pr*r2.q;
    for(const r2 of x.rec.pt)need.parts[r2.id]=(need.parts[r2.id]||0)+pr*r2.q;}
  const cap=24*30*S.p.load,printers=hours/cap;
  const el=$("#planRes");if(!el)return;
  el.innerHTML=`<div class="kpis"><div class="kpi"><span>Прибыль в месяц</span><b>${rub(profit)}</b><small>продать ${n1(pcs,0)} шт</small></div><div class="kpi"><span>Напечатать</span><b>${n1(toPrint,0)} шт</b><small>${n1(hours,0)} ч печати</small></div><div class="kpi"><span>Принтеров</span><b>${toPrint?Math.max(1,Math.ceil(printers-1e-9)):0}</b><small>${toPrint?"загрузка "+pct(printers,0)+" одного":"введите план"}</small></div></div>`;
  const rows=[];
  for(const c of ["plastics","parts"])for(const id in need[c]){const m=find(c,id);if(!m)continue;const n=need[c][id],buy=Math.max(0,n-Math.max(0,m.qty));
    const price=c==="plastics"?(m.pk>0?m.pk:S.p.ppk)/1000:(m.price||0);rows.push({m,c,n,buy,cost:buy*price})}
  rows.sort((a,b)=>b.buy-a.buy);
  const buySum=rows.reduce((a,r)=>a+r.cost,0)+g0*S.p.ppk/1000;
  $("#needSec").innerHTML=`<h2>Материалы под план <small>докупить на ${rub(buySum)}</small></h2>${rows.length||g0?`<div class="scroll"><table class="t"><thead><tr><th>Материал</th><th>Нужно</th><th>Есть</th><th>Докупить</th></tr></thead><tbody>${rows.map(r=>{const u=unitOf(r.c,r.m);return `<tr><td>${esc(r.m.name)}</td><td>${n1(r.n,0)} ${esc(u)}</td><td>${n1(r.m.qty,0)}</td><td class="${r.buy>0?"neg":""}">${r.buy>0?n1(r.buy,0)+" "+esc(u):"хватает"}</td></tr>`}).join("")}${g0?`<tr><td>Пластик без привязки к складу</td><td>${n1(g0,0)} г</td><td>—</td><td class="neg">${n1(g0,0)} г</td></tr>`:""}</tbody></table></div><p class="hint">Пластик: 1 катушка ≈ 1000 г. Чтобы точно знать, какой цвет докупать, добавьте пластик в состав изделий.</p>`:`<p class="hint">Введите план ниже — здесь появится, сколько пластика и деталей нужно и чего не хватает на складе.</p>`}`;
}

function stamp(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function download(name,text,type){try{const blob=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){}}
function copy(text,msg){const fail=()=>{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}t.remove();toast(ok?msg:"Не удалось скопировать")};try{navigator.clipboard.writeText(text).then(()=>toast(msg),fail)}catch(e){fail()}}
function markBackup(){try{localStorage.setItem("master3d_lastbackup",String(Date.now()))}catch(e){}}
function csv(sep){
  const R=ranks(),f=v=>isFinite(v)?String(Math.round(v*100)/100).replace(".",","):"";
  const rows=[["Раздел","Название","Артикул","Остаток","Ед.","Минимум","Статус","Себестоимость/цена ед.","Цена до скидки","Цена после скидки","Прибыль/шт","Маржа %","ROI %","₽/час","Место"]];
  for(const x of S.products){const r=calc(x),w=r.w;rows.push(["Изделия",x.name,x.sku||"",f(x.qty),"шт",f(x.min),STATE_TXT[state(x)],f(r.c.total),w?f(x.wb.pb):"",w?f(w.G):"",w?f(w.Q):"",w?f(w.margin*100):"",w?f(w.roi*100):"",w?f(w.perH):"",R.m[x.id]||""])}
  for(const m of S.plastics)rows.push(["Пластик",m.name,"",f(m.qty),"г",f(m.min),STATE_TXT[state(m)],f(m.pk>0?m.pk:S.p.ppk)+" ₽/кг","","","","","","",""]);
  for(const m of S.parts)rows.push(["Детали",m.name,"",f(m.qty),m.unit,f(m.min),STATE_TXT[state(m)],f(m.price||0),"","","","","","",""]);
  return (sep===";"?"﻿":"")+rows.map(r=>r.map(x=>sep===";"&&/[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x).join(sep)).join("\r\n");
}
let pend={sk:null,ce:null};
function handleImport(text){
  let d;try{d=JSON.parse(text)}catch(e){toast("Это не файл копии");return}
  if(valid(d)){confirmSheet("Загрузить копию?",`В копии ${d.products.length} изделий, ${d.plastics.length} пластиков, ${d.parts.length} деталей. Текущие данные заменятся.`,"Заменить",()=>{S=normalize(d);save();view="products";render();toast("Копия загружена")});return}
  if(d&&Array.isArray(d.items))pend.ce=d;
  else if(d&&Array.isArray(d.products)&&Array.isArray(d.plastics))pend.sk=d;
  else{toast("В файле нет данных мастерской");return}
  drawOld();
}
function drawOld(){
  const b=$("#oldBox");if(!b)return;
  if(!pend.sk&&!pend.ce){b.innerHTML="";return}
  b.innerHTML=`<div class="box"><h3>Перенос из старых приложений</h3><div class="ln"><span>Копия «Склад 3D»</span><span>${pend.sk?(pend.sk.sample?"только примеры":"загружена"):"—"}</span></div><div class="ln"><span>Копия «Цена 3D»</span><span>${pend.ce?"загружена":"—"}</span></div>
   <p class="hint">${!pend.ce?"Можно добавить и копию «Цена 3D», иначе цены возьмутся из таблицы.":!pend.sk?"Можно добавить и копию «Склад 3D», иначе остатки будут пустыми.":"Обе копии на месте."}</p>
   <button type="button" class="btn main" data-act="doMigrate">Перенести (заменит текущие данные)</button></div>`;
}

/* ================= события ================= */
document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const go=()=>{view=b.dataset.v;onlyLow=false;render()};
  if(view==="prod"&&dirty){openSheet(`<h2>Сохранить изменения?</h2><p class="sub" style="margin:0">В изделии есть несохранённые правки.</p><div class="row2"><button type="button" class="btn main" id="l_save">Сохранить</button><button type="button" class="btn" id="l_drop">Не сохранять</button></div>`,s=>{
    s.querySelector("#l_save").onclick=()=>{closeSheet();if(saveDraft(false,true))go()};s.querySelector("#l_drop").onclick=()=>{closeSheet();dirty=false;go()}});return}
  go();
});
$("#fab").addEventListener("click",()=>{if(view==="products")openProd(null);else editMat(matTab,null)});
$("#main").addEventListener("click",e=>{
  if(view==="prod"){const a=e.target.closest("[data-act=hideNotice]");if(a){delete S.notice;save();a.closest(".banner").remove()}return}
  const pr=e.target.closest("[data-prod]");if(pr){openProd(pr.dataset.prod);return}
  const row=e.target.closest(".row[data-c]");if(row){openMat(row.dataset.c,row.dataset.id);return}
  const u=e.target.closest("[data-undo]");if(u){undo(u.dataset.undo);return}
  const so=e.target.closest("[data-sort]");if(so){prodSort=so.dataset.sort;onlyLow=false;renderMain();return}
  const st=e.target.closest("[data-stab]");if(st){salesTab=st.dataset.stab;renderMain();return}
  const mo=e.target.closest("[data-month]");if(mo){salesMonth=mo.dataset.month;renderMain();return}
  const bd=e.target.closest("[data-bind]");if(bd){openBind(bd.dataset.bind);return}
  const mt=e.target.closest("[data-mat]");if(mt){matTab=mt.dataset.mat;onlyLow=false;render();return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="hideNotice"){delete S.notice;save();renderMain()}
  if(act==="syncOn")syncEnable(a);
  if(act==="syncRestore")openKeySheet(false);
  if(act==="syncNow"){a.disabled=true;a.textContent="Сохраняю…";SY.localRev=Math.max(SY.localRev,Date.now());syncPush().then(ok=>{toast(ok?"Сохранено в Google":SY.err||"Не получилось");renderMain()})}
  if(act==="syncPullAsk")confirmSheet("Загрузить из Google?","Данные на этом телефоне заменятся тем, что сохранено в таблице.","Загрузить",async()=>{try{await syncPull();view="products";render();toast("Данные загружены")}catch(e){toast(e.message)}},false);
  if(act==="syncPull")confirmSheet("Загрузить из Google?","Данные на этом телефоне заменятся более новыми из таблицы.","Загрузить",async()=>{try{await syncPull();view="products";render();toast("Данные загружены")}catch(e){toast(e.message)}},false);
  if(act==="syncForce")confirmSheet("Оставить данные телефона?","Данные в Google заменятся тем, что сейчас на этом телефоне.","Заменить в Google",async()=>{SY.localRev=Date.now();const ok=await syncPush({force:true});syncConflict=null;renderMain();toast(ok?"Сохранено в Google":SY.err)});
  if(act==="syncOff")confirmSheet("Выключить синхронизацию?","Данные в Google останутся, но новые изменения туда сохраняться не будут.","Выключить",()=>{SY.on=false;saveSync();topBar();renderMain();toast("Синхронизация выключена")});
  if(act==="salesFetch")salesFetch(a);
  if(act==="goMore"){view="more";render()}
  if(act==="wbUpdate")wbUpdate(a);
  if(act==="wbConnect"){const u=$("#wb_url").value.trim();if(u!==S.wbcfg.url){S.wbcfg.url=u;save()}if(!u){toast("Вставьте адрес веб-приложения");return}a.disabled=true;a.textContent="Подключаю…";wbUpdate(null).then(()=>{if(view==="more")renderMain()})}
  if(act==="wbOff")confirmSheet("Отключить тарифы WB?","Автообновление в приложении выключится. Предметы у изделий сохранятся, скрипт в Google продолжит присылать письма.","Отключить",()=>{S.wbcfg={...WBCFG_DEF};S.wbSnap=null;wbSaveCache(null);try{localStorage.removeItem(WBC)}catch(e){}save();renderMain();toast("Отключено")});
  if(act==="onlyLow"){onlyLow=!onlyLow;renderMain()}
  if(act==="allMat"){onlyLow=false;renderMain()}
  if(act==="exportJson"){download(`masterskaya-${stamp()}.json`,JSON.stringify(S),"application/json");markBackup();toast("Файл сохранён в «Загрузки»");renderMain()}
  if(act==="copyJson"){copy(JSON.stringify(S),"Копия в буфере. Вставьте её в «Избранное» Telegram");markBackup()}
  if(act==="exportCsv"){download(`masterskaya-${stamp()}.csv`,csv(";"),"text/csv");toast("Таблица сохранена в «Загрузки»")}
  if(act==="copyCsv")copy(csv("\t"),"Таблица скопирована. Вставьте её в Excel");
  if(act==="pasteImport"){const t=$("#pasteIn").value.trim();t?handleImport(t):toast("Сначала вставьте текст копии")}
  if(act==="doMigrate")confirmSheet("Перенести данные?","Текущие данные приложения заменятся данными из старых копий.","Перенести",()=>{S=normalize(migrate(pend.sk,pend.ce));pend={sk:null,ce:null};save();view="products";render();toast("Данные перенесены")},false);
  if(act==="resetP")confirmSheet("Вернуть параметры?","Все параметры станут как в вашей таблице.","Вернуть",()=>{S.p={...DEF};save();renderMain();toast("Параметры восстановлены")});
  if(act==="wipe")confirmSheet("Очистить всё?","Удалятся изделия, материалы и журнал. Вернуть можно только из копии.","Очистить",()=>{S=normalize({v:2,p:S.p,wbcfg:S.wbcfg,products:[],plastics:[],parts:[],log:[]});S.wbSnap=null;save();view="products";render();toast("Очищено")});
});
$("#main").addEventListener("change",e=>{
  if(e.target.id==="wb_url"){const nu=e.target.value.trim();if(nu!==S.wbcfg.url){S.wbcfg.url=nu;save();renderMain()}}
  if(e.target.id==="wb_wh"){S.wbcfg.wh=e.target.value;save();toast("Склад выбран. Тариф запомнится при следующем обновлении")}
  if(e.target.id==="wb_model"){S.wbcfg.model=e.target.value;save();renderMain();toast("Схема изменена")}
  if(e.target.id==="fileIn"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>handleImport(String(r.result));r.readAsText(f);e.target.value=""}
  if(e.target.dataset&&e.target.dataset.p){const v=num(e.target.value);if(isFinite(v)&&v>=0){S.p[e.target.dataset.p]=v/(+e.target.dataset.m);save();toast("Сохранено, всё пересчитано")}else{toast("Введите число");e.target.value=String(Math.round(S.p[e.target.dataset.p]*e.target.dataset.m*1000)/1000).replace(".",",")}}
});
$("#main").addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.plan){const it=find("products",e.target.dataset.plan);const v=num(e.target.value);it.plan=v>0?v:0;save();planUpdate()}
});
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

window.__m={calc,S:()=>S,migrate,wholesale,wbPropose,wbT,SY:()=>SY,salesAgg};
render();
if(SY.on)setTimeout(syncCheck,800);
document.addEventListener("visibilitychange",()=>{if(!SY.on)return;if(document.visibilityState==="hidden"){if(SY.localRev>SY.pushedRev){clearTimeout(syncTimer);syncPush()}}else syncCheck()});
})();
