<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WB Аналитика</title>
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#0b0b10;--surface:#15141c;--sunk:#0f0e14;--fg:#f3f2f7;--muted:#8e8a9c;--line:#262433;--accent:#c86bff;--accent-fg:#1b0626;--accent-soft:#2c1b3a;
  --ok:#5fd08a;--ok-soft:#173222;--warn:#f0b450;--warn-soft:#3a2c12;--bad:#ff6b6b;--bad-soft:#3d1b1b;--c1:#c86bff;--c2:#6c7a92;--c3:#f0a050;--c4:#58b4ff;--c5:#ffd75e;--c6:#ff6b8a;
  --f-d:"Unbounded","Manrope",system-ui,sans-serif;--f-b:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-n:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 55% at 50% -10%,#2a1640,transparent 60%) fixed,var(--bg);color:var(--fg);font:15px/1.45 var(--f-b);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.top{position:sticky;top:0;z-index:5;background:rgba(11,11,16,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.brand{font:700 clamp(16px,4.6vw,19px)/1.1 var(--f-d);white-space:nowrap}.brand span{color:var(--accent)}
.per{border:1px solid rgba(255,255,255,.1);background:#1b1a24;border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
main{padding-block:6px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.card{border:1px solid rgba(255,255,255,.06);border-radius:22px;background:linear-gradient(180deg,#1a1922,#121118);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font:700 14px/1.25 var(--f-d);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.card h2 small{font:500 12px var(--f-b);color:var(--muted)}
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,#17141f),#110f16 70%)}
.big{font:700 34px/1.05 var(--f-n);font-variant-numeric:tabular-nums}.big.neg{color:var(--bad)}
.sub{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.sub b{font-family:var(--f-n);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:rgba(255,255,255,.035);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;border:0;text-align:left;color:inherit}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:700}
.kpi b{font:700 19px/1.2 var(--f-n);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:11.5px;color:var(--muted)}
.dl{font:700 11px var(--f-n);margin-left:6px;white-space:nowrap;vertical-align:2px}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}.dl.z{color:var(--muted)}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.banner{border-radius:16px;padding:10px 12px;background:var(--warn-soft);font-size:13px}.banner.bad{background:var(--bad-soft)}.banner.ok{background:var(--accent-soft)}
.lines{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.ln{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ln>span:last-child{font-family:var(--f-n);white-space:nowrap}
.ln.total{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--sunk)}.stack i{display:block;height:100%}.stack i+i{border-left:2px solid #15141c}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid rgba(255,255,255,.08);background:#16151d;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.search{width:100%;padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#0e0d13}
.list{display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.06);border-radius:22px;background:linear-gradient(180deg,#1a1922,#121118);overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid rgba(255,255,255,.05);background:none;text-align:left;width:100%;color:inherit}
.row:last-child{border-bottom:0}.row:active{background:rgba(255,255,255,.03)}
.ph{width:44px;height:56px;border-radius:10px;background:#0e0d13 center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:11px}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}.info b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.num b{font:700 15px var(--f-n);white-space:nowrap}.num small{font:600 12px var(--f-n);white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mid{color:var(--warn)}
.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.t th{color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.t td{text-align:right;padding:6px;border-bottom:1px solid rgba(255,255,255,.05);font-family:var(--f-n);white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left;font-family:var(--f-b);white-space:normal}
.scroll{overflow-x:auto}
.inp{width:100%;padding:11px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#0e0d13;min-width:0}
.field{display:flex;flex-direction:column;gap:5px}.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}.field small{font-size:11.5px;color:var(--muted)}
.btn{border:1px solid rgba(255,255,255,.08);background:#1d1c26;border-radius:99px;padding:12px 14px;font-weight:700;text-align:center}
.btn.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 8px 26px -8px var(--accent)}
.btn.small{padding:8px 12px;font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1 1 140px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;border:1px solid rgba(255,255,255,.08);border-radius:24px;background:rgba(21,20,28,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 16px 40px rgba(0,0,0,.6)}
@media(min-width:1000px){.tabs{left:50%;right:auto;width:888px;transform:translateX(-50%)}}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);height:62px}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);position:relative;z-index:0}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}.tabs button.on::before{content:"";position:absolute;top:6px;width:44px;height:32px;border-radius:12px;background:var(--accent-soft);z-index:-1}
.back{position:fixed;inset:0;z-index:20;background:rgba(5,5,10,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#15141c;width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;border-top:1px solid rgba(255,255,255,.08);padding:18px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font:700 18px/1.25 var(--f-d)}
.chart{width:100%;height:auto;display:block}.chart text{font:500 10px var(--f-b);fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--fg);margin-bottom:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">WB<span>.</span>Аналитика</div><button type="button" class="per" id="per">30 дней</button></div></header>
<main class="wrap" id="main"></main>
<nav class="tabs"><div class="in">
  <button type="button" data-v="sum"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Сводка</button>
  <button type="button" data-v="goods"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Товары</button>
  <button type="button" data-v="stock"><svg viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v11H3z"/><path d="M8 20v-6h8v6"/></svg>Остатки</button>
  <button type="button" data-v="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Ещё</button>
</div></nav>
<div class="back" id="back" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:NaN};
const rub=(n,d=0)=>isFinite(n)?(+n).toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d})+" ₽":"—";
const n1=(n,d=1)=>isFinite(n)?n.toLocaleString("ru-RU",{maximumFractionDigits:d}):"—";
const pct=(f,d=1)=>isFinite(f)?(f*100).toLocaleString("ru-RU",{maximumFractionDigits:d})+"%":"—";
const div=(a,b)=>b?a/b:NaN;
const KEY="wbstat_v1",CK="wbstat_cache",ON_SERVER=location.protocol!=="file:"&&!/github\.io$/.test(location.hostname);
const DEF={url:"",key:"",tax:0.07,base:"retail",per:"30",from:"",to:"",view:"sum",sort:"revenue"};
let S=(()=>{try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return {...DEF}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let R=(()=>{try{return JSON.parse(localStorage.getItem(CK)||"null")}catch(e){return null}})(),loading=false,err="",q="";
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)};
const iso=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
const ddmm=s=>s?s.slice(8,10)+"."+s.slice(5,7):"";
function range(){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth(),D=n=>iso(new Date(Date.now()-n*864e5));
  switch(S.per){case"7":return [D(6),iso(t),"7 дней"];case"30":return [D(29),iso(t),"30 дней"];case"90":return [D(89),iso(t),"90 дней"];
    case"m":return [iso(new Date(y,m,1)),iso(t),new Date(y,m,1).toLocaleDateString("ru-RU",{month:"long"})];
    case"pm":return [iso(new Date(y,m-1,1)),iso(new Date(y,m,0)),new Date(y,m-1,1).toLocaleDateString("ru-RU",{month:"long"})];
    default:return [S.from||D(29),S.to||iso(t),ddmm(S.from)+"–"+ddmm(S.to)]}
}
async function gGet(p){
  if(!(/^https:\/\/[^\/]+\/.+/.test(S.url)||/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\//.test(S.url)))throw new Error("Сначала подключите таблицу: «Ещё» → «Подключение».");
  const u=S.url+"?"+Object.entries(p).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  let r;try{r=await fetch(u,{redirect:"follow"})}catch(e){throw new Error("Нет связи с Google. Проверьте интернет.")}
  try{return await r.json()}catch(e){throw new Error("Google ответил не данными. Проверьте развертывание скрипта.")}
}
async function gPost(b){let r;try{r=await fetch(S.url,{method:"POST",redirect:"follow",body:JSON.stringify(Object.assign({key:S.key},b))})}catch(e){throw new Error("Нет связи с Google.")}return r.json()}
const errText=e=>e==="wrong_key"?"Ключ доступа не подходит. Посмотрите его в таблице: меню «WB Аналитика» → «Показать ключ доступа».":e;
async function load(){
  if(!S.url||!S.key){render();return}
  const [from,to]=range();loading=true;err="";render();
  try{const d=await gGet({action:"report",key:S.key,from,to,tax:S.tax,base:S.base});if(!d.ok)throw new Error(errText(d.error));d.at=Date.now();R=d;try{localStorage.setItem(CK,JSON.stringify(d))}catch(e){}}
  catch(e){err=e.message}
  loading=false;render();
}
/* ---------- показатели ---------- */
function m(o){
  const buy=o.dlv>=1?div(o.dlv-o.back,o.dlv):div(o.saleQ,o.ordQ-o.cancQ);
  return {buy,drrO:div(o.adSum,o.ordSum),drrS:div(o.adSum,o.revenue),margin:div(o.profit,o.revenue),logPer:div(o.log,o.netQ),wb:o.revenue-o.pay,
    otherAll:o.stor+o.acc+o.pen+o.other,stock:o.fbo+o.fbs,days:o.perDay>0?(o.fbo+o.fbs)/o.perDay:NaN,roi:div(o.profit,o.costSum)};
}
/* сравнение с прошлым периодом той же длины: inv — рост плохо (расходы) */
const PV=()=>R&&R.prev&&!R.prev.partial?R.prev:null;
function dl(cur,prev,inv){if(prev==null||!isFinite(prev)||!isFinite(cur))return "";if(!prev)return cur?`<em class="dl z" title="в прошлом периоде было 0">новое</em>`:"";
  const ch=(cur-prev)/Math.abs(prev);if(Math.abs(ch)<0.005)return `<em class="dl z">0%</em>`;const good=inv?ch<0:ch>0;
  return `<em class="dl ${good?"up":"down"}" title="прошлый период: ${n1(prev,0)}">${ch>0?"▲":"▼"}${n1(Math.abs(ch)*100,Math.abs(ch)<0.1?1:0)}%</em>`}
function dt(f,inv){const p=PV();return p?dl(R.total[f],p.total[f],inv):""}
function kpi(t,v,s,cls,act,d){return `<${act?"button type=button data-go="+act:"div"} class="kpi ${cls||""}"><span>${t}</span><b>${v}${d||""}</b>${s?`<small>${s}</small>`:""}</${act?"button":"div"}>`}
function status(){
  if(!R||!R.status)return "";const st=R.status,er=[st.errStat&&"Заказы: "+st.errStat,st.errFin&&"Отчёты: "+st.errFin,st.errAds&&"Реклама: "+st.errAds,st.errStock&&"Остатки: "+st.errStock].filter(Boolean);
  const est=R.estDays&&R.estDays.length?`<div class="banner">За ${R.estDays.length} дн. (с ${ddmm(R.estDays[0])}) отчёта WB ещё нет: выручка и «к перечислению» взяты из оперативной статистики, логистика и хранение появятся с отчётом. Итог за эти дни предварительный.</div>`:"";
  return est+(er.length?`<div class="banner bad">${er.map(esc).join("<br>")}</div>`:"");
}
function chart(days,wp){
  if(!days||!days.length)return "";const W=340,Hh=140,top=10,bot=20,bw=(W-6)/days.length;
  const mx=Math.max(1,...days.map(d=>Math.max(d.revenue,d.ordSum,wp?d.profit||0:0))),mn=wp?Math.min(0,...days.map(d=>d.profit||0)):0;
  const y=v=>top+(Hh-top-bot)*(1-(Math.max(mn,v)-mn)/(mx-mn)),y0=y(0);
  const bars=days.map((d,i)=>`<rect x="${3+i*bw+bw*.15}" y="${Math.min(y0,y(d.revenue))}" width="${bw*.7}" height="${Math.abs(y0-y(d.revenue))}" rx="2" fill="var(--c1)"><title>${ddmm(d.d)}: выручка ${rub(d.revenue)}, заказы ${rub(d.ordSum)}, реклама ${rub(d.ads)}${wp?", прибыль "+rub(d.profit):""}</title></rect>`).join("");
  const line=(f,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${days.map((d,i)=>`${3+i*bw+bw/2},${y(d[f])}`).join(" ")}"/>`;
  const step=Math.ceil(days.length/7),lbl=days.map((d,i)=>i%step?"":`<text x="${3+i*bw+bw/2}" y="${Hh-5}" text-anchor="middle">${ddmm(d.d)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Выручка, заказы и реклама по дням">${mn<0?`<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>`:""}${bars}${line("ordSum","var(--c4)")}${line("ads","var(--c6)")}${wp?line("profit","var(--ok)"):""}${lbl}</svg>
   <div class="legend"><span><i style="background:var(--c1)"></i>Выручка</span><span><i style="background:var(--c4)"></i>Заказы, ₽</span><span><i style="background:var(--c6)"></i>Реклама</span>${wp?`<span><i style="background:var(--ok)"></i>Прибыль</span>`:""}</div>`;
}
function sumHtml(){
  if(!S.url||!S.key)return `<div class="card"><div class="empty"><b>Подключите таблицу</b>Приложение берёт данные кабинета WB из вашей Google Таблицы со скриптом. Откройте «Ещё» → «Подключение».</div><button type="button" class="btn main" data-go="more">Подключить</button></div>`;
  if(!R)return `<div class="card"><div class="empty">${loading?`<span class="spin"></span> Загружаю…`:err?`<b>Не получилось</b>${esc(err)}`:"Нет данных"}</div></div>`;
  const t=R.total,x=m(t),P=S.tax;
  const seg=[["Комиссия и эквайринг WB",x.wb,"--c2"],["Логистика",t.log,"--c3"],["Хранение, приёмка, штрафы",x.otherAll,"--c4"],["Реклама",t.adSum,"--c6"],["Налог",t.tax,"--c5"],["Закуп",t.costSum,"#7d6f9a"],["Прибыль",Math.max(0,t.profit),"--ok"]].filter(s=>s[1]>0);
  const tot=seg.reduce((a,s)=>a+s[1],0)||1,col=c=>c.startsWith("--")?`var(${c})`:c;
  return `${err?`<div class="banner bad">${esc(err)}</div>`:""}${status()}
  <div class="card hero"><h2>Прибыль <small>${esc(range()[2])} · ${ddmm(R.from)}–${ddmm(R.to)}</small></h2>
   <div class="big ${t.profit<0?"neg":""}">${rub(t.profit)}${dt("profit")}</div>
   <div class="sub"><span>маржа <b>${pct(x.margin,1)}</b></span><span>выручка <b>${rub(t.revenue)}</b></span>${t.costSum?`<span>ROI <b>${pct(x.roi,0)}</b></span>`:""}</div>

   .concat(L.map(o=>{const y=m(o),pv=P&&P.items[o.nm];return [o.nm||"без артикула",o.art,o.title,o.ordQ,r2(o.ordSum),o.cancQ,o.netQ,o.retQ,o.brakQ,p1(y.buy),r2(o.revenue),P?r2(pv?pv.revenue:0):"",pv?ch(o.revenue,pv.revenue):"",r2(o.pay),r2(o.log),r2(y.otherAll),r2(o.adSum),p1(y.drrO),r2(o.tax),o.cost||"",r2(o.costSum),r2(o.profit),p1(y.margin),o.netQ>0?r2(o.profit/o.netQ):"",o.fbo,o.fbs]})),
   [12,14,34,9,11,8,10,9,7,9,12,12,10,12,11,14,11,10,10,10,11,12,9,11,9,9]);

   .concat(R.items.filter(o=>o.nm&&(o.fbo||o.fbs||o.perDay)).map(o=>{const y=m(o);return [o.nm,o.art,o.title,o.fbo,o.fbs,o.toCl,o.fromCl,o.perDay,isFinite(y.days)?Math.round(y.days):"",o.cost?r2(o.cost*(o.fbo+o.fbs)):""]})),[12,14,34,9,9,10,10,12,10,12]);

   <div>• <b>Выручка</b> — сумма реализации по отчётам WB (за дни без отчёта — по оперативной статистике).</div>
   <div>• <b>Выкуп</b> — доставки, которые покупатель забрал ÷ все доставки.</div>
   <div>• <b>ДРР</b> — расходы на рекламу ÷ сумма заказов (и ÷ выручка). У кампании — расход ÷ сумма заказов, которые WB приписал этой кампании.</div>
   <div>• <b>▲▼ %</b> — изменение к прошлому периоду такой же длины (для «30 дней» — 30 дней перед ними).</div>
   <div>• <b>Брак</b> — строки отчёта WB с обоснованием «брак» (компенсации и возвраты брака).</div>
   <div>• <b>Прибыль</b> — к перечислению − логистика − хранение, приёмка, штрафы, прочие удержания − реклама − налог − закуп.</div></div></div>`;
}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  $("#per").textContent=range()[2];
  const M=$("#main");M.innerHTML=(loading&&R?`<p class="hint" style="text-align:center"><span class="spin"></span> Обновляю…</p>`:"")+(S.view==="goods"?goodsHtml():S.view==="stock"?stockHtml():S.view==="more"?moreHtml():sumHtml());
  const qi=$("#q");if(qi)qi.oninput=()=>{q=qi.value.trim().toLowerCase();const p=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
}
function openSheet(h,mount){const s=$("#sheet");s.innerHTML=h;$("#back").hidden=false;s.scrollTop=0;if(mount)mount(s)}
function closeSheet(){$("#back").hidden=true;$("#sheet").innerHTML=""}
$("#back").addEventListener("click",e=>{if(e.target.id==="back")closeSheet()});
function openPeriod(){
  const P=[["7","7 дней"],["30","30 дней"],["90","90 дней"],["m","Этот месяц"],["pm","Прошлый месяц"]];
  openSheet(`<h2>Период</h2><div class="chips">${P.map(([k,l])=>`<button type="button" class="chip ${S.per===k?"on":""}" data-p="${k}">${l}</button>`).join("")}</div>
   <div class="row2"><label class="field"><span>С</span><input id="p_f" class="inp" type="date" value="${esc(S.from||range()[0])}"></label><label class="field"><span>По</span><input id="p_t" class="inp" type="date" value="${esc(S.to||range()[1])}"></label></div>
   <button type="button" class="btn main" id="p_ok">Показать за эти даты</button><p class="hint">WB хранит заказы 90 дней. Таблица копит данные дальше — до 400 дней.</p>`,s=>{
    s.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.per=b.dataset.p;save();closeSheet();load()});
    s.querySelector("#p_ok").onclick=()=>{const f=s.querySelector("#p_f").value,t=s.querySelector("#p_t").value;if(!f||!t||f>t){toast("Проверьте даты");return}S.per="c";S.from=f;S.to=t;save();closeSheet();load()};
  });
}
function openItem(nm){
  const o=R.items.find(x=>x.nm===nm);if(!o)return;const x=m(o),P=PV(),pv=P?(P.items[nm]||{revenue:0,profit:0}):null;
  const L=(t,v,cls)=>`<div class="ln"><span>${t}</span><span class="${cls||""}">${v}</span></div>`;
  openSheet(`<div style="display:flex;gap:12px;align-items:center">${o.photo?`<span class="ph" style="width:64px;height:84px;background-image:url('${esc(o.photo)}')"></span>`:""}<div><h2>${esc(o.title||("Арт. "+o.nm))}</h2><p class="hint">${esc(o.art)} · ${o.nm}${o.subj?" · "+esc(o.subj):""}</p></div></div>
   <div class="grid">${kpi("Прибыль",rub(o.profit),`маржа ${pct(x.margin,1)}`,o.profit<0?"bad":"ok","",pv?dl(o.profit,pv.profit):"")}${kpi("Выручка",rub(o.revenue),`${n1(o.netQ,0)} шт`,"","",pv?dl(o.revenue,pv.revenue):"")}${kpi("Выкуп",pct(x.buy,0),o.dlv?`${n1(o.dlv-o.back,0)} из ${n1(o.dlv,0)}`:"")}${kpi("ДРР",pct(x.drrO,1),`от продаж ${pct(x.drrS,1)}`)}</div>
   <div class="card" id="i_ch" style="padding:12px"><h2>По дням <small>${ddmm(R.from)}–${ddmm(R.to)}</small></h2><p class="hint"><span class="spin"></span> Загружаю…</p></div>
   <label class="field"><span>Закуп за 1 шт, ₽</span><div class="row2"><input id="i_cost" class="inp" inputmode="decimal" value="${o.cost||""}" placeholder="например 120"><button type="button" class="btn main" id="i_save" style="flex:0 0 auto">Сохранить</button></div></label>
   <div class="lines">${L("Заказы",`${n1(o.ordQ,0)} шт · ${rub(o.ordSum)}`)}${L("Отмены",`${n1(o.cancQ,0)} шт`)}${L("Продажи",`${n1(o.saleQ,0)} шт · ${rub(o.saleSum)}`)}${L("Возвраты",`${n1(o.retQ,0)} шт · ${rub(o.retSum)}`)}${L("Брак",`${n1(o.brakQ,0)} шт${o.brakSum?" · компенсация "+rub(o.brakSum):""}`)}
   ${L("<b>Выручка (реализация)</b>",rub(o.revenue))}${L("Комиссия и эквайринг WB","−"+rub(x.wb))}${L("К перечислению",rub(o.pay))}${L("Логистика",`−${rub(o.log)} · ${rub(x.logPer)}/шт`)}${L("Хранение, приёмка, штрафы, удержания","−"+rub(x.otherAll))}
   ${L("Реклама",`−${rub(o.adSum)} · ${n1(o.adClicks,0)} кликов, ${n1(o.adOrders,0)} заказов`)}${L("Налог "+pct(S.tax,0),"−"+rub(o.tax))}${L("Закуп",o.cost?`−${rub(o.costSum)} (${n1(o.netQ,0)} × ${rub(o.cost)})`:"не указан","")}
   <div class="ln total"><span>Прибыль</span><span class="${o.profit<0?"neg":"pos"}">${rub(o.profit)}</span></div>${o.netQ>0?L("Прибыль на 1 шт",rub(o.profit/o.netQ)):""}</div>
   <div class="lines">${L("Остаток FBO / FBS",`${n1(o.fbo,0)} / ${n1(o.fbs,0)} шт`)}${L("Продаётся в день",n1(o.perDay,1))}${L("Хватит на",isFinite(x.days)?n1(x.days,0)+" дн.":"—")}</div>
   ${o.estRev?`<p class="hint">Из выручки ${rub(o.estRev)} — предварительно, по оперативной статистике: отчёта WB за последние дни ещё нет.</p>`:""}
   <button type="button" class="btn" id="i_x">Закрыть</button>`,s=>{
    s.querySelector("#i_x").onclick=closeSheet;
    itemDays(nm).then(d=>{const c=s.querySelector("#i_ch");if(!c||!c.isConnected)return;
      const sold=d.days.filter(z=>z.ordQ||z.netQ||z.ads).length;
      c.innerHTML=`<h2>По дням <small>${ddmm(d.from)}–${ddmm(d.to)}</small></h2>${sold?chart(d.days,1):`<p class="hint">За период нет заказов и рекламы.</p>`}
       ${d.campaigns&&d.campaigns.length?`<div class="lines" style="margin-top:4px"><div class="hint">Рекламные кампании этого товара</div>${d.campaigns.map(campRow).join("")}</div>`:""}`})
     .catch(e=>{const c=s.querySelector("#i_ch");if(c)c.innerHTML=`<h2>По дням</h2><p class="hint">${esc(e.message)}</p>`});
    s.querySelector("#i_save").onclick=async()=>{const v=num(s.querySelector("#i_cost").value);try{const d=await gPost({action:"cost",costs:{[nm]:v>0?v:0}});if(!d.ok)throw new Error(errText(d.error));toast("Закуп сохранён");closeSheet();load()}catch(e){toast(e.message)}};
  });
}
const IC={};
async function itemDays(nm){const k=[nm,R.from,R.to,S.tax,S.base,R.at].join("|");if(IC[k])return IC[k];
  const d=await gGet({action:"item",key:S.key,nm,from:R.from,to:R.to,tax:S.tax,base:S.base});
  if(!d.ok)throw new Error(d.error==="Неизвестное действие"?"График по дням появится после обновления скрипта в таблице до версии 3.":errText(d.error));return IC[k]=d}
function openCosts(){
  if(!R){toast("Сначала загрузите данные");return}
  const L=R.items.filter(o=>o.nm).sort((a,b)=>(a.cost?1:0)-(b.cost?1:0)||b.revenue-a.revenue);
  openSheet(`<h2>Закуп за 1 шт</h2><p class="hint">Себестоимость с доставкой до вас, упаковкой и маркировкой. Пустые — сверху.</p>
   <div class="list">${L.map(o=>`<div class="row" style="grid-template-columns:1fr 110px"><span class="info"><b>${esc(o.title||o.nm)}</b><small>${esc(o.art)} · ${o.nm}</small></span><input class="inp" inputmode="decimal" data-c="${o.nm}" value="${o.cost||""}" placeholder="₽"></div>`).join("")}</div>
   <div class="row2"><button type="button" class="btn main" id="c_ok">Сохранить</button><button type="button" class="btn" id="c_x">Отмена</button></div>`,s=>{
    s.querySelector("#c_x").onclick=closeSheet;
    s.querySelector("#c_ok").onclick=async()=>{const c={};s.querySelectorAll("[data-c]").forEach(i=>{const v=num(i.value),old=(R.items.find(o=>o.nm===+i.dataset.c)||{}).cost||0;if((v>0?v:0)!==old)c[i.dataset.c]=v>0?v:0});
      if(!Object.keys(c).length){closeSheet();return}try{const d=await gPost({action:"cost",costs:c});if(!d.ok)throw new Error(errText(d.error));toast("Сохранено: "+Object.keys(c).length);closeSheet();load()}catch(e){toast(e.message)}};
  });
}
document.addEventListener("click",e=>{
  const tb=e.target.closest(".tabs button");if(tb){S.view=tb.dataset.v;save();render();window.scrollTo(0,0);return}
  if(e.target.closest("#per")){openPeriod();return}
  const so=e.target.closest("[data-sort]");if(so){S.sort=so.dataset.sort;save();render();return}
  const nm=e.target.closest("[data-nm]");if(nm&&R){openItem(+nm.dataset.nm);return}
  const go=e.target.closest("[data-go]");if(go){const g=go.dataset.go;if(g==="cost"){openCosts();return}S.view=g;save();render();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  if(a.dataset.act==="reload")load();
  if(a.dataset.act==="camps")openCamps();
  if(a.dataset.act==="xlsx")exportXlsx(a);
  if(a.dataset.act==="connect"){(async()=>{S.url=$("#s_url").value.trim();S.key=$("#s_key").value.trim();save();a.disabled=true;a.textContent="Проверяю…";
    try{const p=await gGet({action:"ping"});if(!p||p.app!=="wbstat")throw new Error("По этому адресу не скрипт «WB Аналитика». Проверьте адрес.");const d=await gGet({action:"report",key:S.key,from:range()[0],to:range()[1],tax:S.tax,base:S.base});if(!d.ok)throw new Error(errText(d.error));d.at=Date.now();R=d;try{localStorage.setItem(CK,JSON.stringify(d))}catch(x){}toast("Подключено");S.view="sum";save();render()}
    catch(x){toast(x.message);a.disabled=false;a.textContent="Проверить и сохранить"}})()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="s_tax"){const v=num(e.target.value);if(v>=0&&v<=30){S.tax=v/100;save();toast("Налог "+n1(v,2)+"%");load()}else toast("Введите число от 0 до 30")}
  if(e.target.id==="s_base"){S.base=e.target.value;save();load()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&R&&Date.now()-(R.at||0)>10*60000)load()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__w={S:()=>S,R:()=>R,m,load,xlsxBook};
render();load();
})();
</script>
</body>
</html>
